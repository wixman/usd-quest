UNITS.push({
  id: 's3', part: 'p5', title: 'GEOMETRY IN', sub: 'SOP Import, SOP Create & friends', emoji: '📥', color: '#7c6cff', shadow: '#5f50d9',
  items: [
    { id: 's3l1', kind: 'lesson', title: 'Importing SOPs', steps: [
      { t: 'info', h: 'The nodes', p: `• <b>SOP Import</b>: brings SOP geometry from elsewhere into the stage, with lots of conversion settings<br>• <b>SOP Create</b>: build geometry in a SOP network <b>inside</b> the LOP node<br>• <b>SOP Modify</b>: runs a SOP network on existing USD geometry and converts the changes back into USD overrides<br>• <b>Scene Import</b>: imports /obj-level models, materials, lights and cameras<br>• <b>USD Configure SOP</b>: stores import settings as <code>usdconfig…</code> detail attributes on the geometry itself` },
      { t: 'info', h: 'Where do prims go?', p: `SOP geometry has no hierarchy of its own. Without help, all polygons land in one prim called <code>mesh_0</code>.<br><br>The <b>Path Attributes</b> parameter (default: the <code>path</code> and <code>name</code> primitive attributes) tells Houdini where each primitive goes. The <b>Import Path Prefix</b> is prepended to relative paths:<br><br>prefix <code>/world/geo</code>:<br>• <code>mesh_0</code> → <code>/world/geo/mesh_0</code><br>• <code>chair/leg</code> → <code>/world/geo/chair/leg</code><br>• <code>/moon/crater</code> → <code>/moon/crater</code> (absolute, unchanged)` },
      { t: 'mcq', q: 'Prefix is /world/geo. A primitive\'s path attribute is "table/top". Resulting prim?', o: ['/table/top', '/world/geo/table/top', '/world/geo/mesh_0', '/world/table/top'], a: 1, why: 'Relative paths get the prefix.' },
      { t: 'tf', q: 'With no path attribute, each polygon becomes its own prim.', a: false, why: 'All polygons go into a single mesh_0 prim.' },
      { t: 'info', h: 'Attribute mapping', p: `<code>P</code> → <code>points</code> · <code>N</code> → <code>normals</code> · <code>v</code> → <code>velocities</code> · <code>accel</code> → <code>accelerations</code><br><code>Cd</code> → <code>primvars:displayColor</code> · <code>Alpha</code> → <code>primvars:displayOpacity</code><br><code>uv</code> → <code>primvars:st</code> · <code>pscale</code>/<code>width</code> → <code>widths</code> · <code>id</code> → <code>ids</code><br>Other attributes become primvars with the matching interpolation (detail → constant, prim → uniform, point → vertex, vertex → faceVarying).` },
      { t: 'match', q: 'Match SOP → USD.', pairs: [['P', 'points'], ['Cd', 'primvars:displayColor'], ['uv', 'primvars:st'], ['v', 'velocities']] },
      { t: 'info', h: 'Key takeaways', p: `• SOP Import / SOP Create / SOP Modify / Scene Import<br>• <code>path</code>/<code>name</code> attributes + Import Path Prefix decide the hierarchy<br>• Standard attributes map to USD names, and the rest become primvars` },
    ]},
    { id: 's3l2', kind: 'lesson', title: 'Control attributes', steps: [
      { t: 'info', h: 'usd* attributes', p: `Special primitive attributes let your SOP network control the USD:<br><br><code>usdkind</code>: set the prim's kind<br><code>usdpurpose</code>: default / render / proxy / guide<br><code>usdvisibility</code>: invisible / inherit<br><code>usdactive</code>: 0 or 1<br><code>usdmaterialpath</code>: bind a material<br><code>usdinherits</code> / <code>usdspecializes</code>: add arcs<br><code>usdprimtype</code> on points: create prims of that type, e.g. Xforms or lights<br><code>usdapischemas</code>: apply API schemas<br><code>osd_scheme</code>: subdivision scheme per face` },
      { t: 'mcq', q: 'Which SOP attribute assigns a material during import?', o: ['shop_materialpath', 'usdmaterialpath', 'material', 'Cd'], a: 1, why: 'usdmaterialpath authors material bindings for SOP Import / SOP Create.' },
      { t: 'info', h: 'Subsets & instancing', p: `• <b>Subset Groups</b>: SOP primitive groups become <b>GeomSubsets</b>, ready for per-face materials.<br>• <b>Packed primitives</b> can import as <b>point instancers</b> or <b>native instances</b>. <code>usdinstancerpath</code> sets where the instancer goes, and <code>usdprototypespath</code> where prototypes go.` },
      { t: 'info', h: 'Time & topology', p: `By default SOP Import <b>time-samples</b> attributes, and Hydra does extra work for time-sampled values even if there's only one sample.<br><br>For static geometry: list attributes in <b>Set Default Values</b> (stored as defaults, not samples) and set <b>Topology Attributes</b> to <b>Static</b>. In big scenes this matters a lot.<div class="tip">💡 USD expects right-handed winding and Houdini is left-handed, so SOP Import reverses vertex order for you.</div>` },
      { t: 'tf', q: 'Even a single time sample costs Hydra more than a default value.', a: true, why: 'Hydra treats time-sampled data as potentially animated.' },
      { t: 'match', q: 'Match.', pairs: [['usdkind', 'Prim kind'], ['usdpurpose', 'Render/proxy/guide'], ['Subset Groups', 'GeomSubsets'], ['usdinstancerpath', 'Point instancer path']] },
      { t: 'info', h: 'Key takeaways', p: `• <code>usd*</code> attributes control kind, purpose, visibility, materials, arcs and prim types<br>• Groups become GeomSubsets, and packed prims become instancers or native instances<br>• Use static topology + Set Default Values for non-animated data` },
    ]},
    { id: 's3d1', kind: 'drill', title: 'Import drill', steps: [
      { t: 'mcq', q: 'Build geometry with SOPs inside a LOP node, no external SOP network:', o: ['SOP Import', 'SOP Create', 'Scene Import', 'Reference'], a: 1, why: 'SOP Create contains its own SOP subnet.' },
      { t: 'mcq', q: 'Edit existing USD geometry with SOPs and write back overrides:', o: ['SOP Modify', 'SOP Import', 'Merge', 'Graft'], a: 0, why: 'SOP Modify.' },
      { t: 'fill', q: 'Make imported prims render-only.', lang: 'py', code: `// primitive wrangle before import\ns@▢ = "▢";`, blanks: ['usdpurpose', 'render'], extra: ['usdkind', 'proxy', 'purpose'], why: 'usdpurpose = "render".' },
      { t: 'tf', q: 'SOP Import can import packed primitives as a PointInstancer.', a: true, why: 'Packed prims → point instancers or native instances.' },
    ]},
  ]
});

UNITS.push({
  id: 's4', part: 'p5', title: 'PRIM PATTERNS', sub: 'Selecting prims like a pro', emoji: '🎯', color: '#7c6cff', shadow: '#5f50d9',
  items: [
    { id: 's4l1', kind: 'lesson', title: 'Path patterns', steps: [
      { t: 'info', h: 'Why patterns', p: `Almost every LOP has a <b>Primitives</b> parameter saying which prims to affect. You can type paths, but the real power is the <b>pattern syntax</b>:<br><br><code>*</code>: any characters <b>within one name</b><br><code>**</code>: any number of <b>levels</b><br><code>?</code>: exactly one character<br><code>[abc]</code>: one of these characters<br><br><code>/Kitchen/*</code>: children of Kitchen<br><code>/Kitchen/Chair*</code>: Chair1, ChairBig…<br><code>/Kitchen/**/Handle[1234]</code>: Handle1–4 at any depth` },
      { t: 'widget', w: 'patternTester', h: 'Pattern tester', p: 'Tap a pattern (or type your own) and see which prims match.' },
      { t: 'mcq', q: 'Which matches every prim at any depth under /World/Props?', o: ['/World/Props/*', '/World/Props/**', '/World/Props?', '/World/Props/[*]'], a: 1, why: '** spans any number of levels. * only matches one level.' },
      { t: 'info', h: 'Set operators', p: `Combine patterns:<br>• <b>Union</b>: a space or <code>+</code>: <code>/a/* /b/*</code><br>• <b>Intersection</b>: <code>&amp;</code><br>• <b>Subtraction</b>: <code>-</code> or <code>^</code>: <code>/Kitchen/* - /Kitchen/Fridge</code><br>• <b>Grouping</b>: <code>( )</code><div class="warn">⚠️ All operators share <b>one precedence level</b>, left to right. <code>/* - /a /b</code> means <code>(/* - /a) + /b</code>, which adds /b back! Write <code>/* - (/a /b)</code>.</div>` },
      { t: 'mcq', q: 'You want everything under /set except /set/a and /set/b. Which is right?', o: ['/set/* - /set/a /set/b', '/set/* - (/set/a /set/b)', '/set/* & /set/a /set/b', '/set/** ^ /set/a'], a: 1, why: 'Without parentheses, /set/b gets unioned back in.' },
      { t: 'info', h: 'Key takeaways', p: `• <code>*</code> one level, <code>**</code> any depth, <code>?</code> and <code>[]</code> single chars<br>• space/<code>+</code> union, <code>&amp;</code> intersect, <code>-</code>/<code>^</code> subtract<br>• One precedence level, left to right, so use parentheses` },
    ]},
    { id: 's4l2', kind: 'lesson', title: 'Auto collections', steps: [
      { t: 'info', h: '% queries', p: `<b>Auto collections</b> start with <code>%</code> and select prims by what they <i>are</i>, not where they are:<br><br><code>%type:Mesh</code>: by schema type (subtypes too, so <code>%type:Light</code> matches every kind of light)<br><code>%kind:component</code>: by kind (subkinds too)<br><code>%purpose:proxy</code>: by purpose<br><code>%variant(lod=high)</code>: by variant selection<br><code>%instance</code> / <code>%instanceproxy</code><br><code>%payload(loaded=no)</code><br><code>%shadertype(UsdPreviewSurface)</code><br><code>%rendercamera</code>, <code>%rendersettings</code>` },
      { t: 'info', h: 'Hierarchy & space', p: `<code>%descendants(pat)</code>, <code>%children(pat)</code>, <code>%ancestors(pat)</code>, <code>%parents(pat)</code><br>Shortcuts written <b>after</b> a pattern: <code>pat &gt;&gt;</code> adds descendants, <code>pat &lt;&lt;</code> adds ancestors, <code>pat &lt;&lt;&gt;&gt;</code> both<br><br><code>%bound(/cam)</code>: prims inside the camera frustum<br><code>%closerthan(/cam, 50)</code> · <code>%fartherthan(/cam, 500)</code><br><code>%size(minvolume=…)</code><br><code>%keeprandom(pat, fraction=0.3)</code>: a stable random subset<br><code>%geofrommat(/Mats/Red)</code>: geometry bound to a material` },
      { t: 'mcq', q: 'Select every light in the scene:', o: ['/**/Light*', '%type:Light', '%kind:light', '/lights/*'], a: 1, why: '%type matches by schema (and subtypes), wherever the prims live.' },
      { t: 'mcq', q: 'Select only prims visible to /cams/shot1:', o: ['%bound(/cams/shot1)', '%visible', '%rendercamera', '%closerthan(/cams/shot1)'], a: 0, why: '%bound with a camera tests the frustum.' },
      { t: 'info', h: 'Collections & VEX', p: `• Reference a USD collection: <code>/World.collection:hero</code>, or <code>%/World/hero</code>, or <code>%hero</code> for collections stored on <code>/collections</code>. The <b>Collection LOP</b> builds collections from patterns.<br>• Escape to VEX with <code>{ … }</code>: <code>/world/** &amp; { @radius &gt; 2 }</code>. This is slow, so narrow it with <code>&amp;</code> first.<br>• <code>~</code> <b>prunes</b> traversal: <code>%type:Xform ~ %kind:component</code> finds Xforms but stops descending whenever it hits a component. That's much faster than subtracting descendants.` },
      { t: 'tf', q: 'VEX expressions in patterns are cheap, so use them freely on huge scenes.', a: false, why: 'They\'re expensive. Narrow the search with & and built-in tests first.' },
      { t: 'info', h: 'Key takeaways', p: `• <code>%type</code>, <code>%kind</code>, <code>%purpose</code>, <code>%variant</code>, <code>%bound</code>… select by meaning<br>• <code>&gt;&gt;</code>/<code>&lt;&lt;</code> for descendants/ancestors, <code>~</code> to prune<br>• <code>%name</code> for collections, <code>{ VEX }</code> as a last resort` },
    ]},
    { id: 's4d1', kind: 'drill', title: 'Pattern drill', steps: [
      { t: 'mcq', q: '/Kitchen/Chair? matches…', o: ['Chair1 and ChairA', 'Chair12', 'Chair', 'Every chair at any depth'], a: 0, why: '? = exactly one character.' },
      { t: 'match', q: 'Match the operator.', pairs: [['space or +', 'Union'], ['&', 'Intersection'], ['- or ^', 'Subtraction'], ['~', 'Prune traversal']] },
      { t: 'mcq', q: 'What does <code>%type:Xform ~ %kind:component</code> find?', o: ['Xforms that are also components', 'Xforms outside components, without descending into components', 'All components', 'Xforms minus everything'], a: 1, why: '~ prunes: traversal stops when a component is found, so it\'s a fast way to find Xforms outside components.' },
      { t: 'mcq', q: 'Pick 30% of /forest/* at random, the same each cook:', o: ['%keeprandom(/forest/*, fraction=0.3)', '/forest/*?0.3', '%random(30)', '{ rand(@elemnum) < 0.3 }'], a: 0, why: '%keeprandom gives a stable random subset.' },
    ]},
  ]
});

UNITS.push({
  id: 's5', part: 'p5', title: 'BUILDING ASSETS', sub: 'Component Builder & variants', emoji: '📦', color: '#7c6cff', shadow: '#5f50d9',

    { id: 's5l1', kind: 'lesson', title: 'Component Builder', steps: [
      { t: 'info', h: 'The four nodes', p: `The <b>Component Builder</b> tool drops a network that builds a pipeline-ready USD asset:<br><br>1️⃣ <b>Component Geometry</b>: a SOP network with three outputs: <b>default</b> (final geo), <b>proxy</b> (viewport), <b>simproxy</b> (collision)<br>2️⃣ <b>Material Library</b>: a VOP network of materials<br>3️⃣ <b>Component Material</b>: assigns materials to geometry (and its subsets)<br>4️⃣ <b>Component Output</b>: assembles the asset, writes files, makes thumbnails, registers it in the catalog` },
      { t: 'info', h: 'What it creates', p: `Inside the stage:<br><code>/chair</code>: an Xform with <b>kind = component</b>, payloaded<br>&nbsp;&nbsp;<code>/chair/geo</code>: a Scope. With proxy outputs it gets <code>/proxy</code> (purpose proxy) and <code>/render</code> (purpose render)<br>&nbsp;&nbsp;<code>/chair/mtl</code>: a Scope of materials<br>plus <code>/__class__/chair</code>, a <b>class</b> the root inherits, ready for shot-level broadcast overrides.` },

      { t: 'info', h: 'Files written', p: `On <b>Save to Disk</b> (nothing is written before that), under <code>usd/assets/&lt;name&gt;/</code> by default:<br><br><code>chair.usd</code>: the interface, pointing at the payload<br><code>payload.usdc</code>: <b>references</b> (not sublayers) the parts, so variant opinions override correctly<br><code>geo.usdc</code> · <code>mtl.usdc</code> · <code>extra.usdc</code> (only if you add extra LOPs inside Component Output)<br>a thumbnail, and a <code>variants/</code> folder if you use variants` },
      { t: 'tf', q: 'Component Builder writes files continuously as you edit.', a: false, why: 'Nothing is written until you click Save to Disk (or Save to Disk in Background).' },

      { t: 'info', h: 'Key takeaways', p: `• Geometry → Material Library → Component Material → Component Output<br>• default / proxy / simproxy outputs, root kind = component, class prim, payload<br>• Files: interface .usd + payload + geo/mtl/extra + thumbnail, written on Save to Disk` },
    ]},

      { t: 'info', h: 'Geometry variants', p: `Make one <b>Component Geometry</b> node per variant and wire them into <b>Component Geometry Variants</b>. Variant names default to the node names, and the set is called <code>geo</code> by default.<br><br>(Multiple or nested <i>geometry</i> variant sets aren't supported here.)` },
      { t: 'info', h: 'Material variants', p: `Add extra <b>Component Material</b> nodes, each with a <b>Variant Name</b>, to create a material variant set (<code>mtl</code> by default). You can have several material variant sets. Choose the default selections on Component Output (<b>Set Default Variants</b>).` },
      { t: 'match', q: 'Match the default variant set name.', pairs: [['geo', 'Geometry variants'], ['mtl', 'Material variants']] },

      { t: 'info', h: 'LOD & variant tools', p: `• <b>Create LOD</b>: generates LOD levels with PolyReduce and stores them as variants<br>• <b>Auto Select LOD</b>: picks a LOD variant by camera distance<br>• <b>Add Variant</b> / <b>Set Variant</b> / <b>Explore Variants</b>: author, select and visualise variants on any prim<br>• <b>Asset Reference</b>: reference + transform + choose variants in one node` },
      { t: 'mcq', q: 'Pick LOD variants automatically based on distance to camera:', o: ['Create LOD', 'Auto Select LOD', 'Set Variant', 'Draw Mode'], a: 1, why: 'Auto Select LOD.' },
      { t: 'info', h: 'Key takeaways', p: `• Geometry variants via Component Geometry Variants (<code>geo</code>). Material variants via extra Component Material nodes (<code>mtl</code>)<br>• The Asset Catalog feeds layout tools<br>• Create LOD / Auto Select LOD / Explore Variants / Asset Reference` },

      { t: 'mcq', q: 'What kind does the Component Builder root get?', o: ['assembly', 'group', 'component', 'subcomponent'], a: 2, why: 'component.' },

UNITS.push({
  id: 's6', part: 'p5', title: 'LAYOUT & INSTANCING', sub: 'References, Paint Instances, Edit', emoji: '🏙️', color: '#7c6cff', shadow: '#5f50d9',
  items: [
    { id: 's6l1', kind: 'lesson', title: 'Bringing assets in', steps: [
      { t: 'info', h: 'Reference LOP', p: `The <b>Reference LOP</b> references files (or other LOP branches) onto a prim. Key parameters: the <b>Primitive Path</b> (where it lands), the <b>Reference File</b>, an optional <b>Reference Primitive</b> (otherwise the defaultPrim), and whether to reference or <b>payload</b>.<br><br>Remember the USD rule: referencing is the only way to load the <b>same file at many locations</b>.` },
      { t: 'info', h: 'Faster options', p: `• <b>Asset Reference</b>: reference + transform + set variants in one node<br>• <b>Stage Manager</b>: reference many files at once and arrange them in a tree view<br>• <b>Graft Stages</b> / <b>Graft Branches</b>: attach branches from other inputs into the tree<br>• <b>Duplicate</b>: copy a prim and its children` },

      { t: 'tf', q: 'Changing the viewer load mask stops LOP nodes from editing those payloads.', a: false, why: 'Load masks only change display. Configure Stage controls actual loading.' },
      { t: 'mcq', q: 'Reference + move + pick a variant, all in one node:', o: ['Reference', 'Asset Reference', 'Graft Stages', 'Stage Manager'], a: 1, why: 'Asset Reference combines Reference, Xform and Set Variant.' },
      { t: 'info', h: 'Key takeaways', p: `• Reference LOP (file + optional prim, reference or payload), Asset Reference, Stage Manager<br>• Houdini loads payloads by default. Configure Stage controls loading, load masks only control display` },
    ]},
    { id: 's6l2', kind: 'lesson', title: 'Placing & scattering', steps: [
      { t: 'info', h: 'Paint Instances (was Layout)', p: `<div class="hou">🆕 In Houdini 22 the <b>Layout LOP</b> was renamed <b>Paint Instances</b>.</div><br>It's a viewer state for <b>placing, scattering and painting</b> USD assets as point instances:<br><br>• Add assets from the <b>Asset Catalog</b> to its prototype gallery<br>• Pick a <b>brush</b> (place, paint, scatter…). Brushes are SOP-network HDAs, and you can make your own<br>• Switch to <b>edit mode</b> to move, rotate and resize instances with handles and physics (the same tools as the Edit LOP)` },
      { t: 'info', h: 'Edit & physics', p: `The <b>Edit LOP</b> lets you transform prims interactively in the viewer, with optional <b>physics</b>: drop objects so they settle and collide naturally. The <b>Drop LOP</b> simulates dropping prims under gravity.<br><br>The <b>Transform LOP</b> is the procedural, parameter-driven alternative.` },
      { t: 'mcq', q: 'In Houdini 22, which node replaced the Layout LOP?', o: ['Stage Manager', 'Paint Instances', 'Scatter Instances', 'Edit'], a: 1, why: 'Layout was renamed Paint Instances.' },
      { t: 'info', h: 'Instancing nodes', p: `• <b>Copy to Points</b>: instance or copy prims onto points (native instances, point instancers or real copies)<br>• <b>PointInstancer</b>: create or edit a PointInstancer from SOP points<br>• <b>Scatter Instances</b> (new in 22): a Hydra generative procedural for scattering<br>• <b>Assign Prototypes</b>: swap which prototype instances use<br>• <b>Modify Point Instances</b>: edit individual instances<br>• <b>Extract Instances</b>: turn an instance into an editable prim ("hero" it)<br>• <b>Prune</b>: hide or deactivate prims <i>and individual point instances</i>` },
      { t: 'match', q: 'Match the job to the node.', pairs: [['Hero one instance', 'Extract Instances'], ['Swap the tree model used', 'Assign Prototypes'], ['Remove some instances', 'Prune'], ['Scatter onto points', 'Copy to Points']] },
      { t: 'info', h: 'Houdini USD tips', p: `• Instance a parent <b>Xform</b>, not the gprim itself<br>• Houdini supports <b>nested</b> point instancing<br>• Store file paths relative to <code>$HIP</code> or <code>$JOB</code>, and use forward slashes even on Windows` },
      { t: 'info', h: 'Key takeaways', p: `• Paint Instances (formerly Layout) + Asset Catalog for interactive dressing<br>• Edit/Drop for physics placement, Transform for procedural moves<br>• Copy to Points / PointInstancer / Scatter Instances / Assign Prototypes / Extract Instances / Prune` },
    ]},
    { id: 's6d1', kind: 'drill', title: 'Layout drill', steps: [

      { t: 'tf', q: 'Unloaded payloads still match prim patterns.', a: false, why: 'They don\'t match patterns and aren\'t affected by LOPs.' },
      { t: 'mcq', q: 'Make one instanced tree fully editable:', o: ['Extract Instances', 'Assign Prototypes', 'Layer Break', 'Draw Mode'], a: 0, why: 'Extract Instances.' },
      { t: 'mcq', q: 'Where do Paint Instances get their assets?', o: ['The Asset Catalog', 'The Scene Graph Layers pane', 'MPlay', 'The shelf'], a: 0, why: 'Assets are added from the Asset Catalog.' },

UNITS.push({
  id: 's7', part: 'p5', title: 'MATERIALS & MATERIALX', sub: 'Look development in LOPs', emoji: '🖌️', color: '#7c6cff', shadow: '#5f50d9',
  items: [
    { id: 's7l1', kind: 'lesson', title: 'Material Library', steps: [
      { t: 'info', h: 'Shaders → USD prims', p: `The <b>Material Library LOP</b> contains a VOP network. Every material you build inside it becomes a USD <b>Material</b> prim (with Shader prims inside) on the stage. Double-click it to go inside.<br><br>Two builders matter:<br>• <b>Karma Material Builder</b> (Karma MaterialX Builder): the tab menu shows Karma-compatible MaterialX, Preview Surface and Karma nodes. This is the usual choice.<br>• <b>USD MaterialX Builder</b>: pure-USD MaterialX graphs, for portability to other renderers` },
      { t: 'info', h: 'Why MaterialX', p: `<b>MaterialX</b> is an open standard for shading networks. In Solaris, MaterialX nodes are stored directly as USD shader prims.<br><br>Karma <b>XPU never supports VEX shaders</b>, so MaterialX is described as "probably the future" of Karma shading. It works on both Karma CPU and XPU.` },
      { t: 'mcq', q: 'You want a material that renders on both Karma CPU and XPU. Build it from…', o: ['VEX shader nodes', 'MaterialX nodes', 'Mantra Principled', 'Material style sheets'], a: 1, why: 'XPU never supports VEX shaders. MaterialX works on both.' },
      { t: 'info', h: 'The node toolkit', p: `• <b>MtlX Standard Surface</b>: the go-to physically based uber-shader (like Principled). <b>MtlX OpenPBR Surface</b> is the newer standard.<br>• <b>MtlX Image</b>: textures. Set <b>Signature</b> to <i>Color</i> for colour maps, and <i>Vector3</i> for normal maps (so no colour space is applied).<br>• <b>MtlX Texcoord</b>: reads <code>st</code>/<code>uv</code> (Signature Vector2).<br>• <b>MtlX Normalmap</b>: tangent-space → world normal for the shader's <code>normal</code> input.<br>• <b>MtlX Geompropvalue</b>: read <b>any primvar</b> (without the <code>primvars:</code> prefix).<br>• <b>MtlX Displacement</b> → wire into a <b>Surface Material</b> (or Collect) node.<br>• Filenames support the <code>&lt;UDIM&gt;</code> token.` },
      { t: 'mcq', q: 'Reading a normal map with MtlX Image, Signature should be…', o: ['Color', 'Vector3', 'Float', 'String'], a: 1, why: 'Vector3, so no colour-space transform corrupts the normal data.' },
      { t: 'mcq', q: 'Read a custom primvar "wetness" inside a MaterialX network:', o: ['MtlX Geompropvalue with name "wetness"', 'MtlX Image', 'Attribute Wrangle', 'primvars:wetness texture'], a: 0, why: 'Geompropvalue reads primvars by name, without the primvars: prefix.' },
      { t: 'info', h: 'Gotchas', p: `• Colour Space parameters are <b>metadata only</b>. Hydra doesn't pass them to delegates.<br>• MaterialX has no string inputs, so you can't wire primvar <i>names</i> from a material's public interface.<br>• Karma doesn't support MaterialX light shaders, or surface + volume materials on the same prim.<br>• Only <code>&lt;UDIM&gt;</code> works as a filename token. MaterialX <code>{frame}</code> does not.` },
      { t: 'info', h: 'Key takeaways', p: `• Material Library → Karma Material Builder → MaterialX nodes → USD Material prims<br>• Standard Surface / OpenPBR, MtlX Image (signatures!), Texcoord, Normalmap, Geompropvalue<br>• XPU needs MaterialX (no VEX). Only <code>&lt;UDIM&gt;</code> tokens` },
    ]},
    { id: 's7l2', kind: 'lesson', title: 'Assigning materials', steps: [
      { t: 'info', h: 'Assign Material', p: `The <b>Assign Material</b> LOP binds materials to prims: set <b>Primitives</b> (a pattern) and the <b>Material Path</b> (e.g. <code>/materials/rust</code>). It authors MaterialBindingAPI + <code>material:binding</code> for you, and can also handle overrides, VEX-driven assignments and geometry subsets.<br><br>Assignments made directly on the Material Library LOP work too.` },
      { t: 'info', h: 'More tools', p: `• <b>Material Linker</b>: rule-based assignments with a UI<br>• <b>Edit Material Network</b>: change parameters and connections of existing materials, even ones from files you can't edit<br>• <b>Edit Material Properties</b>: a spare-parm interface for material inputs<br>• <b>Material Variation</b>: per-prim/per-instance overrides of material parameters (via primvars)<br>• <b>Vary Material Assignment</b>: randomise which material each prim gets<br>• <b>Unassign Material</b>` },
      { t: 'match', q: 'Match the LOP.', pairs: [['Assign Material', 'Bind by pattern'], ['Material Linker', 'Rule-based assignments'], ['Edit Material Network', 'Tweak existing materials'], ['Material Variation', 'Per-instance parameter overrides']] },
      { t: 'info', h: 'Reusing .mtlx files', p: `To use a MaterialX document from disk, use a <b>Reference LOP</b> pointing at the <code>.mtlx</code>, pick the material via <b>Reference Primitive</b>, then assign it. SideFX recommends <b>referencing</b> over sublayering for this.<br><br>Right-click a material prim → <b>Edit Primitive ▸ New node to edit primitive…</b> creates an edit node for it.` },
      { t: 'tf', q: 'A .mtlx file can be brought into Solaris with a Reference LOP.', a: true, why: 'USD\'s MaterialX file format plugin reads .mtlx as a layer.' },
      { t: 'info', h: 'Key takeaways', p: `• Assign Material (pattern + material path) is the workhorse<br>• Material Linker, Edit Material Network, Material Variation, Vary Material Assignment<br>• Reference .mtlx files, then assign` },
    ]},
    { id: 's7d1', kind: 'drill', title: 'Lookdev drill', steps: [
      { t: 'mcq', q: 'Which LOP turns VOP shader networks into USD Material prims?', o: ['Material Library', 'Assign Material', 'SOP Import', 'Configure Layer'], a: 0, why: 'Material Library.' },
      { t: 'tf', q: 'Karma XPU can render VEX-based shaders.', a: false, why: 'XPU never supports VEX shaders.' },
      { t: 'mcq', q: 'Texture filename token for tiled UV textures:', o: ['<UDIM>', '{frame}', '$F4', '%(tile)d'], a: 0, why: '<UDIM> is supported. MaterialX {frame} is not.' },
      { t: 'mcq', q: 'Colour map in MtlX Image, Signature:', o: ['Color', 'Vector3', 'Integer', 'Matrix'], a: 0, why: 'Color for colour maps.' },
    ]},
  ]
});

UNITS.push({
  id: 's8', part: 'p5', title: 'LIGHTS & CAMERAS', sub: 'Lighting in Solaris', emoji: '🔦', color: '#7c6cff', shadow: '#5f50d9',
  items: [
    { id: 's8l1', kind: 'lesson', title: 'Light LOPs', steps: [
      { t: 'info', h: 'Creating lights', p: `• <b>Light LOP</b>: creates or edits any UsdLux light (rect, disk, sphere, cylinder…)<br>• <b>Distant Light</b> (sun) and <b>Dome Light</b> (HDRI environment)<br>• <b>Geometry Light</b>: turns geometry into lights (MeshLightAPI)<br>• <b>Portal Light</b>: limits which parts of a dome light are sampled, e.g. through windows, for cleaner interiors<br>• <b>Karma Physical Sky</b> / <b>Karma Sky Dome Light</b> / <b>Karma Sky Atmosphere</b>: sun + sky rigs<br><br>They author standard UsdLux prims (<code>inputs:intensity</code>, <code>inputs:exposure</code>, <code>inputs:color</code>…), so everything from the UsdLux unit applies.` },
      { t: 'info', h: 'A Houdini gotcha', p: `In classic Houdini, hiding a light's display didn't stop it lighting the scene. In <b>LOPs/USD</b>, turning off a light's display (visibility) <b>does turn off its contribution</b>.` },
      { t: 'tf', q: 'In Solaris, making a light invisible also stops it illuminating the scene.', a: true, why: 'Unlike classic Houdini, USD visibility switches off the light\'s contribution.' },
      { t: 'mcq', q: 'An interior lit by a dome through windows is noisy. Which helps sampling?', o: ['Portal Light', 'Geometry Light', 'Light Mixer', 'Distant Light'], a: 0, why: 'Portal lights focus dome-light sampling through openings.' },
      { t: 'info', h: 'Managing many lights', p: `• <b>Light Mixer</b>: an interactive panel to edit intensity, exposure, colour, solo and mute across many lights at once<br>• <b>Light Linker</b>: authors light-linking and shadow-linking collections from rules (who lights what)<br>• <b>Light Filter Library</b> / <b>Karma Blocker Light Filter</b>: shape and block light<br>• <b>LPE Tag</b>: tag lights so you can split them into separate AOVs` },
      { t: 'match', q: 'Match.', pairs: [['Light Mixer', 'Balance many lights interactively'], ['Light Linker', 'Who lights what'], ['LPE Tag', 'Per-light AOVs'], ['Portal Light', 'Guide dome sampling']] },
      { t: 'info', h: 'Key takeaways', p: `• Light / Distant / Dome / Geometry / Portal / Physical Sky LOPs author UsdLux prims<br>• Invisible light = no contribution in USD<br>• Light Mixer, Light Linker, light filters, LPE Tag` },
    ]},
    { id: 's8l2', kind: 'lesson', title: 'Cameras & constraints', steps: [
      { t: 'info', h: 'Camera LOP', p: `The <b>Camera LOP</b> creates a USD Camera prim (focal length, aperture, clipping, fStop, focus distance). Look through it in the viewport, or <b>lock</b> the view to it to place it interactively.<br><br>Karma needs a camera: the render settings point at it (<code>rel camera</code>).` },
      { t: 'info', h: 'Constraints', p: `LOPs can evaluate constraints live and <b>bake</b> the results into transforms when USD is written (USD stores results, not rigs):<br><br>• <b>Look At Constraint</b>: keep a prim (camera, light) aimed at a target<br>• <b>Parent Constraint</b>, <b>Follow Path Constraint</b>, <b>Points Constraint</b>, <b>Surface Constraint</b>, <b>Blend Constraint</b>` },
      { t: 'mcq', q: 'Keep a spotlight aimed at a moving character:', o: ['Look At Constraint', 'Light Linker', 'Parent Constraint', 'Draw Mode'], a: 0, why: 'Look At Constraint.' },
      { t: 'tf', q: 'USD stores live constraint rigs that renderers evaluate.', a: false, why: 'USD stores computed results. LOP constraints are baked when written out.' },
      { t: 'info', h: 'Key takeaways', p: `• Camera LOP → a USD Camera, which render settings reference<br>• Constraint LOPs (Look At, Parent, Follow Path…) bake to transforms on output` },
    ]},
    { id: 's8d1', kind: 'drill', title: 'Lighting drill', steps: [
      { t: 'mcq', q: 'An HDRI environment light:', o: ['Distant Light', 'Dome Light', 'Portal Light', 'Geometry Light'], a: 1, why: 'Dome Light.' },
      { t: 'mcq', q: 'Make the rim light skip the hero\'s face:', o: ['Light Linker', 'Light Mixer', 'Prune', 'Draw Mode'], a: 0, why: 'Light linking collections, authored by the Light Linker.' },
      { t: 'tf', q: 'The Light Mixer can solo and mute lights.', a: true, why: 'Yes, it\'s an interactive lighting control panel.' },
    ]},
  ]
});

UNITS.push({
  id: 's9', part: 'p5', title: 'KARMA RENDERING', sub: 'CPU vs XPU, settings, AOVs, husk', emoji: '📸', color: '#7c6cff', shadow: '#5f50d9',
  items: [
    { id: 's9l1', kind: 'lesson', title: 'Karma basics', steps: [
      { t: 'info', h: 'What Karma is', p: `<b>Karma</b> is Houdini's physically based path tracer, built on USD: it's a <b>Hydra render delegate</b> and it reads USD scenes. It replaces Mantra for new projects.<br><br>Two engines:<br>• <b>Karma CPU</b>: runs entirely on the CPU and supports more legacy features<br>• <b>Karma XPU</b>: CPU + GPU together, much faster, but drops more legacy features (e.g. <b>no VEX shaders</b>)` },
      { t: 'match', q: 'Match.', pairs: [['Karma CPU', 'CPU only, more legacy features'], ['Karma XPU', 'CPU + GPU, no VEX shaders'], ['Hydra delegate', 'How Karma plugs into the viewer'], ['Mantra', 'The older renderer Karma replaces']] },
      { t: 'info', h: 'Setting up a render (Houdini 22)', p: `The modern setup is two nodes:<br><br>1️⃣ <b>Karma Render Settings LOP</b>: creates the <b>RenderSettings</b>, <b>RenderProduct</b> and <b>RenderVar</b> prims, configured for Karma (camera, resolution, samples, AOVs, output path)<br>2️⃣ <b>USD Render ROP</b> (also available as a LOP): renders the stage. It hands the USD to <b>husk</b>, Karma's command-line renderer<div class="hou">🆕 The all-in-one <b>Karma LOP</b> and the old <b>Karma Render Properties</b> node are <b>deprecated</b> in Houdini 22. Use Karma Render Settings + USD Render instead.</div>` },
      { t: 'mcq', q: 'In Houdini 22, the recommended render setup is…', o: ['Karma LOP only', 'Karma Render Settings LOP + USD Render ROP', 'Mantra ROP', 'Karma Render Properties'], a: 1, why: 'The Karma LOP and Karma Render Properties are deprecated.' },
      { t: 'info', h: 'Previewing', p: `• <b>Viewport IPR</b>: switch the viewer delegate to Karma CPU/XPU<br>• <b>Render to MPlay</b>: a progressive preview window, where clicking an area focuses the render there<br>• <b>Render Gallery</b>: Snap captures the viewport, and Background renders into the snapshot strip (snapshots from the viewport don't capture every AOV)` },
      { t: 'info', h: 'Key takeaways', p: `• Karma = USD path tracer and Hydra delegate. CPU vs XPU (no VEX on XPU)<br>• Karma Render Settings LOP + USD Render ROP (→ husk)<br>• Preview with viewport IPR, MPlay or the Render Gallery` },
    ]},
    { id: 's9l2', kind: 'lesson', title: 'Sampling & noise', steps: [
      { t: 'info', h: 'Primary samples', p: `<b>Primary samples</b> (also called <b>pixel samples</b>) are rays fired from the camera through each pixel. They resolve anti-aliasing, motion blur and depth of field.<br><br>On <b>XPU</b>, the main control is <b>Path Traced Samples</b>: the number of camera paths per pixel. More samples, less noise.` },
      { t: 'info', h: 'Convergence modes', p: `The <b>convergence mode</b> decides how secondary (bounce) rays are sent:<br><br>• <b>Path Traced</b>: at most one indirect ray per bounce. Simple and fast to start. <b>XPU only supports this mode.</b><br>• <b>Automatic</b> (CPU only): Karma decides how many secondary rays each bounce needs, with many per-component controls (diffuse, reflection, refraction, SSS quality…)<br><br>A <b>pixel oracle</b> (default: <b>Variance</b>) stops sampling pixels once they're clean enough (the <b>Variance Threshold</b>).` },
      { t: 'mcq', q: 'Which convergence mode does Karma XPU support?', o: ['Automatic', 'Path Traced', 'Both', 'Neither'], a: 1, why: 'XPU only supports Path Traced.' },
      { t: 'mcq', q: 'Your XPU render is noisy everywhere. Main control to raise?', o: ['Path Traced Samples', 'Secondary Noise Level', 'Diffuse Quality', 'Ray Bias'], a: 0, why: 'On XPU, adding path-traced samples is the main lever for all noise.' },
      { t: 'info', h: 'Denoising & tips', p: `• Karma ships with <b>Intel OIDN</b>, and NVIDIA <b>OptiX</b> is also supported<br>• Use <b>Portal Lights</b> for dome-lit interiors<br>• Strong depth of field or heavy motion often converges faster with path-traced convergence or a uniform pixel oracle<br>• Rendering several frames in one process saves time` },
      { t: 'tf', q: 'Primary/path traced samples can be set per object with Render Geometry Settings.', a: false, why: 'Primary Samples and Path Traced Samples can\'t be set per object.' },
      { t: 'info', h: 'Key takeaways', p: `• Primary (pixel) samples vs secondary rays. XPU: Path Traced Samples<br>• Convergence: Path Traced (CPU+XPU) or Automatic (CPU only). The pixel oracle stops clean pixels early<br>• Denoise with OIDN / OptiX` },
    ]},
    { id: 's9l3', kind: 'lesson', title: 'AOVs & per-object settings', steps: [
      { t: 'info', h: 'AOVs = RenderVars', p: `Extra image planes (AOVs) are <b>RenderVar</b> prims in USD:<br><br>• <b>Karma Standard Render Vars</b>: quickly adds the standard Karma AOVs (diffuse, specular, emission, albedo, normal, depth…)<br>• <b>Render Var LOP</b>: define any variable, including a <b>Light Path Expression</b> (LPE) such as <code>C&lt;RD&gt;L</code> for direct diffuse<br>• <b>Karma Cryptomatte</b>: ID mattes for compositing<br>• <b>Render Product</b> / <b>Karma Render Products</b>: group vars into output files` },
      { t: 'mcq', q: 'An AOV in USD terms is a…', o: ['RenderProduct', 'RenderVar', 'RenderSettings', 'Collection'], a: 1, why: 'Each channel/AOV is a RenderVar.' },
      { t: 'info', h: 'Per-object & per-light settings', p: `• <b>Render Geometry Settings</b> LOP: per-object Karma settings (e.g. render visibility, subdivision, displacement quality, motion blur samples, holdouts). Karma object properties live in the <code>primvars:karma:object</code> namespace, which is why they inherit down the tree like constant primvars.<br>• <b>Lights</b>: Karma light properties live under <code>inputs:karma:light</code>.<br>• <b>Karma Shadow Catcher</b>, <b>Karma Background Plate</b>: holdouts and matte setups.` },
      { t: 'mcq', q: 'Why do Karma per-object settings inherit from parent prims?', o: ['They\'re variants', 'They\'re stored as primvars (primvars:karma:object…)', 'Houdini copies them', 'They don\'t'], a: 1, why: 'Constant primvars inherit down namespace.' },
      { t: 'info', h: 'husk', p: `<b>husk</b> is Karma's standalone command-line renderer. It renders any USD file with RenderSettings, which is great on a farm:<br><br><code>husk shot.usd</code> (with options for frame range, output and so on)<br><br>The USD Render ROP writes the USD, then runs husk on it. husk can render several RenderSettings prims from one process.` },
      { t: 'tf', q: 'husk can render a USD file outside of an interactive Houdini session.', a: true, why: 'It\'s a standalone command-line renderer.' },
      { t: 'info', h: 'Key takeaways', p: `• AOVs = RenderVars: Standard Render Vars, Render Var (LPEs), Cryptomatte<br>• Render Geometry Settings → <code>primvars:karma:object…</code> (inherits). Lights → <code>inputs:karma:light…</code><br>• <b>husk</b> renders USD from the command line` },
    ]},
    { id: 's9d1', kind: 'drill', title: 'Karma drill', steps: [
      { t: 'match', q: 'Match the node.', pairs: [['Karma Render Settings', 'Settings/Product/Vars prims'], ['USD Render ROP', 'Launches the render (husk)'], ['Karma Cryptomatte', 'ID mattes'], ['Render Geometry Settings', 'Per-object settings']] },
      { t: 'tf', q: 'Karma CPU supports Automatic convergence.', a: true, why: 'CPU supports Automatic and Path Traced.' },
      { t: 'mcq', q: 'Default pixel oracle:', o: ['Uniform', 'Variance', 'None', 'Adaptive LPE'], a: 1, why: 'Variance.' },
      { t: 'mcq', q: 'Which ships with Karma out of the box for denoising?', o: ['Intel OIDN', 'Neat Video', 'RenderMan denoiser', 'None'], a: 0, why: 'OIDN, with OptiX also supported.' },
    ]},
  ]
});

// ------------------------------------------------------------ S10
UNITS.push({
  id: 's10', part: 'p5', title: 'WRITING USD', sub: 'USD ROP, save paths, time & caching', emoji: '💾', color: '#7c6cff', shadow: '#5f50d9',
  items: [
    { id: 's10l1', kind: 'lesson', title: 'The USD ROP', steps: [
      { t: 'info', h: 'Writing to disk', p: `The <b>USD</b> render node writes your stage out. It exists as a <b>LOP</b> (at the end of a network) and as a <b>ROP</b> (in a render network pointing at a LOP).<br><br>• <b>Output File</b>: the top-level file, which receives the root layer data<br>• Layers with a <b>save path</b> are written to <b>their own files</b><br>• Layers <b>read from disk</b> are left unmodified<br>• In-memory layers without a save path are folded into the top-level output file` },
      { t: 'info', h: 'Save paths', p: `Give layers their own files with:<br>• <b>Configure Layer</b> → save path<br>• <b>SOP Import</b> / <b>SOP Create</b> → their own save path parameter<br><br>Use <b>absolute</b> paths with variables, e.g. <code>$HIP/usd/props/lamp.usd</code>. The default <b>output processor</b> converts them into <b>relative references</b> between the written files, so the whole set can be moved as a unit.` },
      { t: 'mcq', q: 'Why does the default output processor make references relative?', o: ['Smaller files', 'So the written file set can be moved together', 'Required by USD', 'For Karma XPU'], a: 1, why: 'Relative references keep the bundle portable.' },
      { t: 'info', h: 'Output processors', p: `Output processors are <b>Python plugins</b> that can rewrite save paths, rewrite reference strings and edit each <code>Sdf.Layer</code> before it's written. Studios use them to map paths to their asset system. They live in <code>husdplugins/outputprocessors/</code> on the Houdini path.` },
      { t: 'tf', q: 'The USD ROP rewrites layers that were sublayered from disk.', a: false, why: 'Layers read from disk are left unmodified.' },
      { t: 'info', h: 'Key takeaways', p: `• USD ROP/LOP: Output File + any layer with a save path<br>• Save paths via Configure Layer, SOP Import, SOP Create<br>• Output processors make paths relative (default) or apply studio rules` },
    ]},
    { id: 's10l2', kind: 'lesson', title: 'Time & caching', steps: [
      { t: 'info', h: 'LOPs cook one frame', p: `LOP nodes cook <b>one frame at a time</b>, so the in-memory layers hold a <b>single time sample</b> for the current frame. When you change frames, they recook.<br><br>To get animation into a file, the <b>USD ROP</b> cooks every frame in the range and writes the time samples out. A <b>Cache LOP</b> can store several frames in memory to speed up playback.` },
      { t: 'info', h: 'Flush Data After Each Frame', p: `This USD ROP option controls memory use:<br><br>• <b>Off</b>: each frame is held in memory and stitched with the previous ones, which can use a lot of memory<br>• <b>On</b>: each frame is written to disk as soon as it's cooked<br><br>And the file name matters:<br>• save path <b>with <code>$F</code></b> → <b>one file per frame</b> (each with one sample)<br>• <b>without</b> → <b>one file</b> holding all the samples` },
      { t: 'mcq', q: 'Save path is <code>$HIP/usd/fx/smoke.$F4.usd</code>. What do you get?', o: ['One file with all frames', 'One file per frame', 'An error', 'A .usdz'], a: 1, why: 'A time-varying token like $F gives a file per frame.' },
      { t: 'info', h: 'Value clips & packaging', p: `• For huge per-frame caches, write one file per frame, then combine them into a <b>value clip</b> with the <b>USD Stitch Clips</b> ROP. Only works when the data sits on its own branch.<br>• <b>File Cache</b> LOP: writes layers to disk once, then reads them back (like a SOP File Cache)<br>• <b>USD Zip</b>: builds a single <code>.usdz</code> from written files (with textures)<br>• <b>Geometry Sequence</b> / <b>Geometry Clip Sequence</b>: bring file sequences back in` },
      { t: 'match', q: 'Match.', pairs: [['Cache LOP', 'Hold several frames in memory'], ['File Cache LOP', 'Write once, read back'], ['USD Stitch Clips', 'Per-frame files → value clip'], ['USD Zip', 'Build a .usdz']] },
      { t: 'info', h: 'Context options', p: `<b>Context options</b> are global or network-scoped variables (Edit ▸ Context Options) that you read in expressions with <code>@optionname</code>, e.g. <code>@shot</code>. The <b>Begin/Edit Context Options Block</b> LOPs set them for part of a network. Shot Builder uses this to switch shots.` },
      { t: 'info', h: 'Key takeaways', p: `• LOPs cook one frame at a time. The USD ROP writes the samples for every frame<br>• Flush each frame for memory. <code>$F</code> in the path gives a file per frame<br>• Stitch Clips, File Cache, USD Zip, and context options (<code>@name</code>)` },
    ]},
    { id: 's10d1', kind: 'drill', title: 'Output drill', steps: [
      { t: 'mcq', q: 'Animated SOP Import with "Flush Data After Each Frame" off and no $F in the path gives…', o: ['One file with all samples (more memory while writing)', 'One file per frame', 'Nothing', 'A value clip'], a: 0, why: 'Frames are stitched in memory into one file.' },
      { t: 'tf', q: 'In-memory LOP layers hold every frame of animation at once.', a: false, why: 'They hold one time sample for the current frame.' },
      { t: 'mcq', q: 'Reference a context option named "shot" in an expression:', o: ['$shot', '@shot', '%shot', '{shot}'], a: 1, why: '@optionname.' },
      { t: 'mcq', q: 'Where do custom output processors live?', o: ['husdplugins/outputprocessors on the Houdini path', '$HIP/otls', 'USD_PLUGINPATH only', 'Inside the .hip'], a: 0, why: 'husdplugins/outputprocessors/.' },
    ]},
  ]
});

// ------------------------------------------------------------ S11
UNITS.push({
  id: 's11', part: 'p5', title: 'SCRIPTING SOLARIS', sub: 'Python Script LOP, VEX, Inline USD', emoji: '⌨️', color: '#7c6cff', shadow: '#5f50d9',
  items: [
    { id: 's11l1', kind: 'lesson', title: 'Python Script LOP', steps: [
      { t: 'info', h: 'Full USD API inside a node', lang: 'py', code: `from pxr import UsdGeom\nnode = hou.pwd()\nstage = node.editableStage()\n\ncube = UsdGeom.Cube.Define(stage, '/shapes/cube1')\ncube.GetSizeAttr().Set(1.5)\n\nfor prim in stage.Traverse():\n    pass  # read or edit`, p: 'The <b>Python Script LOP</b> gives you the full pxr API on the node\'s stage:', after: `<code>hou.pwd().editableStage()</code> returns an editable <code>Usd.Stage</code> for this node's output. Its edit target is <b>already set to the active layer</b>. <b>Don't change it</b>.` },

  ['Prim', 'A node in the scene namespace. Has a specifier, type, name, properties.'],
  ['PrimSpec', 'One layer\'s uncomposed description of a prim (Sdf level).'],
  ['Attribute', 'A typed, optionally time-sampled value on a prim.'],
  ['Relationship', 'A property that targets other paths (e.g. material:binding). List-edited.'],
  ['Metadata', 'Name/value info on layers, prims or properties. Never animated.'],
  ['customData / assetInfo', 'Free-form dictionary metadata / asset identity (identifier, name, version).'],
  ['Path', 'Address in namespace: /World/Ball, or /World/Ball.radius for a property.'],
  ['Pseudo-root', 'The hidden root prim "/" above all root prims.'],

function H(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'style' && typeof v === 'object') { for (const sk in v) { if (sk.startsWith('--')) e.style.setProperty(sk, v[sk]); else e.style[sk] = v[sk]; } }
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
const once = (fn) => { let d = false; return () => { if (!d) { d = true; fn(); } }; };
function counter(n, done) { const seen = new Set(); return (k) => { seen.add(k); if (seen.size >= n) done(); }; }
const PAL = { red: '#ff4b4b', blue: '#1cb0f6', green: '#58cc02', gold: '#ffc800', purple: '#ce82ff', pink: '#ff86d0', teal: '#2bd9c4', orange: '#ff9600', grey: '#8b95a7' };

function vpFrame(w, h, inner) {
  // dark viewport with a grid floor
  let grid = '';
  for (let x = 0; x <= w; x += 20) grid += `<line x1="${x}" y1="0" x2="${x}" y2="${h}" />`;
  for (let y = 0; y <= h; y += 20) grid += `<line x1="0" y1="${y}" x2="${w}" y2="${y}" />`;
  return `<svg viewBox="0 0 ${w} ${h}" class="vp"><defs>
    <radialGradient id="shine" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/></radialGradient>
  </defs><g class="grid">${grid}</g>${inner}</svg>`;
}
function ballSVG(cx, cy, r, color, extra = '') {
  return `<g ${extra}><ellipse cx="${cx}" cy="${cy + r + 4}" rx="${r * 0.9}" ry="${r * 0.22}" fill="#000" opacity=".35"/>
  <circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#shine)"/></g>`;
}

// ---------------------------------------------------------- xformOrder
W.xformOrder = (el, done, free) => {
  let order = ['translate', 'rotate', 'scale'];
  const v = { tx: 70, rot: 40, sx: 2 };
  const fin = once(done);
  const vp = H('div', { class: 'vpwrap' }), list = H('div', { class: 'oplist' }), note = H('div', { class: 'muted small center' });
  const apply = (pts, ops) => {
    for (const op of [...ops].reverse()) pts = pts.map(([x, y]) => {
      if (op === 'translate') return [x + v.tx, y];
      if (op === 'scale') return [x * v.sx, y];
      const a = v.rot * Math.PI / 180; return [x * Math.cos(a) - y * Math.sin(a), x * Math.sin(a) + y * Math.cos(a)];
    });
    return pts;
  };
  const sq = [[-15, -15], [15, -15], [15, 15], [-15, 15]];
  const toSvg = (pts) => pts.map(([x, y]) => `${160 + x},${90 - y}`).join(' ');
  const render = () => {
    const ghost = apply(sq, ['translate', 'rotate', 'scale']);
    const cur = apply(sq, order);
    const c = cur[2];
    vp.innerHTML = vpFrame(320, 180, `
      <line x1="160" y1="0" x2="160" y2="180" stroke="#ffffff22"/><line x1="0" y1="90" x2="320" y2="90" stroke="#ffffff22"/>
      <polygon points="${toSvg(ghost)}" fill="none" stroke="#ffffff55" stroke-dasharray="4 4"/>
      <polygon points="${toSvg(cur)}" fill="${PAL.gold}" stroke="#fff" stroke-width="2" class="morph"/>
      <circle cx="${160 + c[0]}" cy="${90 - c[1]}" r="5" fill="${PAL.red}"/>
      <text x="8" y="172" class="vlabel" text-anchor="start">dashed = standard TRS</text>`);
    list.innerHTML = '';
    order.forEach((op, i) => {
      list.append(H('div', { class: 'oprow' },
        H('span', { class: 'opi' }, i + 1),
        H('code', {}, `xformOp:${op === 'rotate' ? 'rotateZ' : op}`),
        H('div', { class: 'opbtns' },
          H('button', { class: 'mini', disabled: i === 0, onclick: () => { [order[i - 1], order[i]] = [order[i], order[i - 1]]; sfx('tap'); fin(); render(); } }, '▲'),
          H('button', { class: 'mini', disabled: i === order.length - 1, onclick: () => { [order[i + 1], order[i]] = [order[i], order[i + 1]]; sfx('tap'); fin(); render(); } }, '▼'))));
    });
    note.innerHTML = `Points get: <b>${[...order].reverse().join(' → ')}</b>`;
  };
  const slider = (label, key, min, max) => H('label', { class: 'sl' }, H('span', {}, label),
    H('input', { type: 'range', min, max, step: key === 'sx' ? 0.1 : 1, value: v[key], oninput: (e) => { v[key] = +e.target.value; render(); } }));
  render();
  el.append(vp, note, list, H('div', { class: 'sliders' }, slider('translate X', 'tx', -100, 120), slider('rotate', 'rot', -180, 180), slider('scale X', 'sx', 0.3, 3)));
};

// ---------------------------------------------------------- timeSamples
W.timeSamples = (el, done) => {
  const samples = [[1, 0], [12, 5], [24, 0]];
  let f = 1, held = false, playing = null;
  const tick = counter(6, done);
  const vp = H('div', { class: 'vpwrap' }), readout = H('div', { class: 'readout' });
  const val = (t) => {
    if (t <= samples[0][0]) return samples[0][1];
    if (t >= samples[samples.length - 1][0]) return samples[samples.length - 1][1];
    for (let i = 0; i < samples.length - 1; i++) {
      const [a, va] = samples[i], [b, vb] = samples[i + 1];
      if (t >= a && t <= b) return held ? va : va + (vb - va) * (t - a) / (b - a);
    }
  };
  const X = (t) => 20 + (t - 1) * (280 / 29), Y = (v) => 150 - v * 22;
  const render = () => {
    let path = '';
    for (let t = 1; t <= 30; t += held ? 0.05 : 1) path += (path ? 'L' : 'M') + X(t).toFixed(1) + ' ' + Y(val(t)).toFixed(1);
    const dots = samples.map(([t, v]) => `<circle cx="${X(t)}" cy="${Y(v)}" r="6" fill="${PAL.gold}" stroke="#000" stroke-width="2"/>`).join('');
    vp.innerHTML = vpFrame(320, 175, `
      <path d="${path}" fill="none" stroke="${PAL.teal}" stroke-width="3"/>${dots}
      <line x1="${X(f)}" y1="0" x2="${X(f)}" y2="175" stroke="${PAL.red}" stroke-width="2"/>
      ${ballSVG(X(f), Y(val(f)) - 14, 12, PAL.red)}`);
    const exact = samples.find(s => s[0] === f);
    readout.innerHTML = `frame <b>${f}</b> → translate.y = <b>${val(f).toFixed(2)}</b> <span class="pill ${exact ? 'y' : 'b'}">${exact ? 'sample' : (f > 24 || f < 1 ? 'held' : held ? 'held' : 'interpolated')}</span>`;
  };
  const slider = H('input', { type: 'range', min: 1, max: 30, value: 1, class: 'big', oninput: (e) => { f = +e.target.value; tick(f); render(); } });
  const playBtn = H('button', { class: 'btn sm blue', onclick: () => {
    if (playing) { clearInterval(playing); playing = null; playBtn.textContent = '▶ PLAY'; return; }
    playBtn.textContent = '⏸ PAUSE';
    playing = setInterval(() => { if (!el.isConnected) { clearInterval(playing); return; } f = f >= 30 ? 1 : f + 1; slider.value = f; tick(f); render(); }, 90);
  }}, '▶ PLAY');
  const modeBtns = H('div', { class: 'chips' }, ['linear', 'held'].map(m => H('button', { class: 'chip' + (m === 'linear' ? ' on' : ''), onclick: (e) => {
    held = m === 'held'; sfx('tap'); e.target.parentNode.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === e.target)); render();
  }}, m)));
  render();
  el.append(vp, readout, slider, H('div', { class: 'row' }, playBtn, modeBtns));
};

    if (mode === 'constant') fills = [PAL.purple, PAL.purple];

      dots = [...c0.map(([x, y, c]) => [x + (x < 100 ? 12 : -12), y + (y < 100 ? 12 : -12), c]), ...c1.map(([x, y, c]) => [x + (x < 200 ? 12 : -12), y + (y < 100 ? 12 : -12), c])]

      ${mode !== 'faceVarying' ? P.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#fff"/>`).join('') : ''}${dots}

W.patternTester = (el, done) => {
  const P = [
    ['/world', 'Xform', 'group'], ['/world/set', 'Xform', 'assembly'],
    ['/world/set/table', 'Xform', 'component'], ['/world/set/table/geo', 'Scope', ''], ['/world/set/table/geo/top', 'Mesh', ''], ['/world/set/table/geo/leg1', 'Mesh', ''],
    ['/world/set/chair1', 'Xform', 'component'], ['/world/set/chair1/geo', 'Scope', ''], ['/world/set/chair1/geo/seat', 'Mesh', ''],
    ['/world/set/chair2', 'Xform', 'component'], ['/world/set/chair2/geo', 'Scope', ''], ['/world/set/chair2/geo/seat', 'Mesh', ''],
    ['/world/lights', 'Scope', ''], ['/world/lights/key', 'RectLight', ''], ['/world/lights/dome', 'DomeLight', ''], ['/world/cam', 'Camera', ''],
  ];
  const presets = ['/world/set/*', '/world/set/**', '/world/set/chair?', '%type:Mesh', '%type:Light', '%kind:component', '%kind:group', '/world/** - /world/set/**', '/world/set/* & %kind:component', '%kind:component >>'];
  const tried = new Set();
  const segRe = (seg) => new RegExp('^' + seg.replace(/[.+^${}()|\\]/g, '\\$&').replace(/\*/g, '[^/]*').replace(/\?/g, '[^/]') + '$');
  const globMatch = (pat, path) => {
    const ps = pat.split('/').filter(Boolean), xs = path.split('/').filter(Boolean);
    const rec = (i, j) => {
      if (i === ps.length) return j === xs.length;
      if (ps[i] === '**') { const last = i === ps.length - 1; for (let k = j + (last ? 1 : 0); k <= xs.length; k++) if (rec(i + 1, k)) return true; return false; }
      return j < xs.length && segRe(ps[i]).test(xs[j]) && rec(i + 1, j + 1);
    };
    return rec(0, 0);
  };
  const KINDS = { group: ['group', 'assembly'], assembly: ['assembly'], component: ['component'], model: ['group', 'assembly', 'component'] };
  const term = (t) => {
    let out;
    if (t.startsWith('%type:')) { const ty = t.slice(6); out = P.filter(p => p[1] === ty || (ty === 'Light' && /Light$/.test(p[1])) || (ty === 'Gprim' && p[1] === 'Mesh') || (ty === 'Xformable' && p[1] !== 'Scope')); }
    else if (t.startsWith('%kind:')) { const k = KINDS[t.slice(6)] || [t.slice(6)]; out = P.filter(p => k.includes(p[2])); }
    else out = P.filter(p => globMatch(t, p[0]));
    return new Set(out.map(p => p[0]));
  };
  const evaluate = (str) => {
    const toks = str.match(/\(|\)|>>|<<|[+\-&^]|[^\s()+&^]+/g) || [];
    let pos = 0;
    const expr = () => {
      let acc = null, op = '+';
      while (pos < toks.length && toks[pos] !== ')') {
        const t = toks[pos++];
        if ('+-&^'.includes(t) && t.length === 1) { op = t; continue; }
        if (t === '>>' || t === '<<') {
          if (!acc) continue; const add = new Set(acc);
          for (const p of P) for (const a of acc) { if (t === '>>' && p[0].startsWith(a + '/')) add.add(p[0]); if (t === '<<' && a.startsWith(p[0] + '/')) add.add(p[0]); }
          acc = add; continue;
        }
        let v; if (t === '(') { v = expr(); pos++; } else v = term(t);
        if (!acc) acc = new Set(op === '+' ? v : []);
        else if (op === '+') v.forEach(x => acc.add(x));
        else if (op === '&') acc = new Set([...acc].filter(x => v.has(x)));
        else v.forEach(x => acc.delete(x));
        op = '+';
      }
      return acc || new Set();
    };
    try { return expr(); } catch (e) { return new Set(); }
  };
  const input = H('input', { class: 'ptin', value: presets[0], oninput: () => { tried.add(input.value); render(); } });
  const tree = H('div', {}), count = H('div', { class: 'muted small center' });
  const render = () => {
    const hits = evaluate(input.value.trim());
    tree.innerHTML = '';
    P.forEach(([p, ty, k]) => { const depth = p.split('/').length - 2; tree.append(H('div', { class: 'prow' + (hits.has(p) ? ' hit' : ''), style: { paddingLeft: (8 + depth * 12) + 'px' } }, p.split('/').pop(), H('span', {}, ty + (k ? ' · ' + k : '')))); });
    count.textContent = `${hits.size} match${hits.size === 1 ? '' : 'es'}`;
    if (tried.size >= 3) done();
  };
  const chips = H('div', { class: 'chips wrap' }, presets.map(pt => H('button', { class: 'chip', style: { fontFamily: 'var(--mono)', fontSize: '11.5px' }, onclick: () => { input.value = pt; tried.add(pt); sfx('tap'); render(); } }, pt)));
  render();
  el.append(chips, input, count, tree);
};

// ---------------------------------------------------------- syntax highlight
const KW = new Set('def over class prepend append delete add uniform custom rel variantSet variantSets variants references payload inherits specializes subLayers apiSchemas kind instanceable from import for in if with as return not and or True False None true false'.split(' '));
const TY = new Set('bool int float double string token asset float2 float3 double3 color3f point3f vector3f normal3f texCoord2f matrix4d quatf quath half'.split(' '));
const MODS = new Set('Usd UsdGeom UsdShade UsdLux Sdf Gf Vt Tf Kind Ar'.split(' '));
function hl(src, lang) {
  const re = /(#[^\n]*|\/\/[^\n]*)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|(@[^@\n]*@)|(<\/[^>\n]*>)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][\w]*)/g;
  let out = '', last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index)); last = re.lastIndex;
    const [t, cm, st, as, pa, nu, w] = m;
    if (cm) out += cm.startsWith('#usda') ? `<span class="k">${esc(cm)}</span>` : `<span class="cm">${esc(cm)}</span>`;
    else if (st) out += `<span class="st">${esc(st)}</span>`;
    else if (as) out += `<span class="as">${esc(as)}</span>`;
    else if (pa) out += `<span class="pa">${esc(pa)}</span>`;
    else if (nu) out += `<span class="nu">${nu}</span>`;
    else if (KW.has(w)) out += `<span class="k">${w}</span>`;
    else if (TY.has(w)) out += `<span class="ty">${w}</span>`;
    else if (MODS.has(w)) out += `<span class="mod">${w}</span>`;
    else if (/^[A-Z]/.test(w)) out += `<span class="ty2">${w}</span>`;
    else out += esc(w);
  }
  return out + esc(src.slice(last));
}

let AC = null;
function sfx(kind) {
  if (!S.settings.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const t = AC.currentTime;
    const note = (f, start, dur, type = 'sine', vol = .18) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t + start);
      g.gain.setValueAtTime(0, t + start); g.gain.linearRampToValueAtTime(vol, t + start + .01);
      g.gain.exponentialRampToValueAtTime(.001, t + start + dur);
      o.connect(g).connect(AC.destination); o.start(t + start); o.stop(t + start + dur + .02);
    };
    if (kind === 'tap') note(660, 0, .06, 'triangle', .08);
    if (kind === 'correct') { note(784, 0, .12, 'triangle'); note(1175, .09, .22, 'triangle'); }
    if (kind === 'wrong') { note(220, 0, .16, 'sawtooth', .09); note(180, .1, .22, 'sawtooth', .09); }
    if (kind === 'match') note(988, 0, .1, 'triangle', .12);
    if (kind === 'done') [523, 659, 784, 1047, 1319].forEach((f, i) => note(f, i * .09, .3, 'triangle', .15));
  } catch (e) {}
  try { if (navigator.vibrate) navigator.vibrate(kind === 'wrong' ? [30, 40, 30] : kind === 'tap' ? 8 : 15); } catch (e) {}
}

async function pushCloud() {

function mergeState(a, b) {
  const m = blank();
  m.settings = a.settings; m.curriculum = CURRICULUM;
  m.xp = Math.max(a.xp || 0, b.xp || 0);
  for (const src of [a, b]) {
    for (const k in src.done || {}) {
      const x = src.done[k], y = m.done[k];
      m.done[k] = !y ? { ...x } : { stars: Math.max(x.stars || 0, y.stars || 0), best: Math.min(x.best ?? 1e9, y.best ?? 1e9), at: Math.max(x.at || 0, y.at || 0) };
    }
    for (const d in src.days || {}) m.days[d] = Math.max(m.days[d] || 0, src.days[d]);
    for (const q in src.miss || {}) m.miss[q] = Math.max(m.miss[q] || 0, src.miss[q]);
  }
  const sa = a.streak || {}, sb = b.streak || {};
  const ta = sa.lastDay ? new Date(sa.lastDay).getTime() : 0, tb = sb.lastDay ? new Date(sb.lastDay).getTime() : 0;
  const base = tb > ta || (tb === ta && (sb.count || 0) > (sa.count || 0)) ? sb : sa;
  m.streak = { count: base.count || 0, lastDay: base.lastDay || null, best: Math.max(sa.best || 0, sb.best || 0, base.count || 0) };
  return m;
}

    line.innerHTML = ''; bank.innerHTML = '';
    picked.forEach((i, n) => line.append(H('button', { class: 'wchip' + (mono ? ' mono' : ''), onclick: () => { picked.splice(n, 1); sfx('tap'); render(); } }, H('span', { class: 'ix' }, n + 1), s.items[i])));
    bankOrder.forEach(i => bank.append(H('button', { class: 'wchip' + (mono ? ' mono' : '') + (picked.includes(i) ? ' used' : ''), onclick: () => { if (picked.includes(i)) return; picked.push(i); sfx('tap'); render(); } }, s.items[i])));
    ctx.setReady(picked.length === s.items.length);
  };
  render(); card.append(H('div', { class: 'muted small', style: { marginBottom: '6px' } }, 'Tap in order. Tap an answer to send it back.'), line, bank);
  return { check: () => { const ok = picked.every((v, i) => v === i); return { ok, answer: s.items.join(' → ') }; } };
};
Q.match = (card, s, ctx) => {
  const L = shuffle(s.pairs.map((p, i) => i)), R = shuffle(s.pairs.map((p, i) => i));
  let sl = null, sr = null, matched = 0, errors = 0;
  const grid = H('div', { class: 'match' });
  const lb = [], rb = [];
  const tryPair = () => {
    if (sl == null || sr == null) return;
    const a = lb.find(b => b._i === sl), b = rb.find(x => x._i === sr);
    if (sl === sr) {
      a.classList.add('ok'); b.classList.add('ok'); a.classList.remove('sel'); b.classList.remove('sel');
      matched++; sfx('match');
      if (matched === s.pairs.length) { ctx.setReady(true); setTimeout(() => ctx.autoCheck(), 350); }
    } else {
      errors++; ctx.mistake(); sfx('wrong');
      [a, b].forEach(x => { x.classList.remove('sel'); x.classList.add('bad'); setTimeout(() => x.classList.remove('bad'), 450); });
    }
    sl = sr = null;
  };
  for (let n = 0; n < s.pairs.length; n++) {
    const l = H('button', { class: 'mcell l', onclick: () => { sl = l._i; sfx('tap'); lb.forEach(x => x.classList.toggle('sel', x === l)); tryPair(); } }, s.pairs[L[n]][0]); l._i = L[n]; lb.push(l);
    const r = H('button', { class: 'mcell', onclick: () => { sr = r._i; sfx('tap'); rb.forEach(x => x.classList.toggle('sel', x === r)); tryPair(); } }, s.pairs[R[n]][1]); r._i = R[n]; rb.push(r);
    grid.append(l, r);
  }
  card.append(grid);
  return { check: () => ({ ok: true, answer: '' , errors }) };
};
Q.fill = (card, s, ctx) => {
  const parts = s.code.split('▢');
  const filled = s.blanks.map(() => null);
  const words = shuffle([...s.blanks, ...(s.extra || [])]);
  const pre = H('pre', { class: 'code' }), bank = H('div', { class: 'bank' });
  const slots = [];
  const render = () => {
    pre.innerHTML = ''; slots.length = 0;
    const nextEmpty = filled.indexOf(null);
    parts.forEach((p, i) => {
      pre.append(H('span', { html: hl(p, s.lang || 'usda') }));
      if (i < parts.length - 1) {
        const sl = H('span', { class: 'slot' + (filled[i] == null ? ' blank' : '') + (i === nextEmpty ? ' next' : ''), onclick: () => { if (filled[i] != null) { filled[i] = null; sfx('tap'); render(); } } }, filled[i] != null ? words[filled[i]] : '____');
        slots.push(sl); pre.append(sl);
      }
    });
    bank.innerHTML = '';
    words.forEach((w, wi) => bank.append(H('button', { class: 'wchip mono' + (filled.includes(wi) ? ' used' : ''), onclick: () => {
      if (filled.includes(wi)) return; const e = filled.indexOf(null); if (e < 0) return; filled[e] = wi; sfx('tap'); render();
    }}, w)));
    ctx.setReady(!filled.includes(null));
  };
  render(); card.append(pre, bank);
  return { check: () => {
    const ok = filled.every((wi, i) => words[wi] === s.blanks[i]);
    slots.forEach((sl, i) => sl.classList.add(words[filled[i]] === s.blanks[i] ? 'right' : 'wrong'));
    return { ok, answer: s.blanks.join(' · ') };
  }};
};

// ---------------------------------------------------------- boot
renderHome();
setTimeout(initCloud, 0);
