<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="USDquest">
<meta name="theme-color" content="#0d1020">
<title>USDquest</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1020; --card:#171b30; --card2:#1f2440; --line:#2a3052; --txt:#f3f5ff; --mut:#8a91b4;
  --green:#58cc02; --greenS:#46a302; --blue:#1cb0f6; --blueS:#1899d6; --red:#ff4b4b; --redS:#d63a3a;
  --gold:#ffc800; --goldS:#e0a800; --purple:#ce82ff; --teal:#2bd9c4; --orange:#ff9600; --pink:#ff86d0;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#07080f;color:var(--txt);font-family:'Nunito',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-weight:700;overscroll-behavior:none}
body{display:flex;justify-content:center}
button{font-family:inherit;font-weight:800;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none}
code{font-family:var(--mono);font-size:.86em;background:#ffffff12;padding:1px 5px;border-radius:5px;font-weight:500}
code.big{font-size:1.05em;display:inline-block;padding:6px 10px;margin:2px 0;color:var(--gold)}
#app{width:100%;max-width:480px;height:100dvh;position:relative;overflow:hidden;
  background:radial-gradient(120% 55% at 50% -12%,rgba(124,108,255,.30) 0%,rgba(28,176,246,.10) 35%,transparent 62%),
  radial-gradient(90% 40% at 50% 112%,rgba(43,217,196,.10) 0%,transparent 60%),var(--bg)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.muted{color:var(--mut)} .small{font-size:12px} .center{text-align:center}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding:12px 16px 8px;position:relative;z-index:5}
.logo{font-weight:900;font-size:22px;letter-spacing:-.5px;flex:1;display:flex;align-items:center;gap:6px}
.logo .o{background:linear-gradient(135deg,var(--blue),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.stat{white-space:nowrap;display:flex;align-items:center;gap:4px;font-weight:900;font-size:15px;padding:6px 10px;border-radius:14px;background:#ffffff0d}
.stat.fire{color:var(--orange)} .stat.fire.dead{color:#666;filter:grayscale(1)}
.stat.xp{color:var(--gold)}
.iconbtn{background:#ffffff0d;border:none;border-radius:14px;width:38px;height:38px;font-size:18px;display:grid;place-items:center}
.goal{position:relative;width:38px;height:38px}
.goal svg{transform:rotate(-90deg)}
.goal span{position:absolute;inset:0;display:grid;place-items:center;font-size:14px}

/* ---------- roadmap ---------- */
.unit{margin:8px 14px 26px}
.ubanner{border-radius:20px;padding:16px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 5px 0 var(--us);position:relative;overflow:hidden}
.ubanner:after{content:'';position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:#ffffff1f}
.ubanner .ue{font-size:34px;filter:drop-shadow(0 3px 0 #0003)}
.ubanner h2{margin:0;font-size:17px;font-weight:900;letter-spacing:.5px;color:#fff;text-shadow:0 2px 0 #0002}
.ubanner p{margin:2px 0 0;font-size:12.5px;color:#ffffffd9}
.ubanner .uprog{margin-left:auto;font-weight:900;font-size:13px;background:#0003;padding:5px 9px;border-radius:12px;color:#fff;z-index:1}
.path{position:relative;padding:54px 0 4px;display:flex;flex-direction:column;align-items:center;gap:18px}
.nodewrap.curwrap{margin-top:26px}
.nodewrap{position:relative;display:flex;flex-direction:column;align-items:center}
.node{width:74px;height:68px;border-radius:50%;border:none;font-size:28px;display:grid;place-items:center;position:relative;
  background:var(--nc);box-shadow:0 7px 0 var(--ns),inset 0 -4px 0 #0001;transition:transform .08s}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ns)}
.node.locked{--nc:#2b3150;--ns:#1d2139;filter:saturate(.2);opacity:.75}
.node.done{--nc:var(--gold);--ns:var(--goldS)}
.node.current{animation:bob 1.6s ease-in-out infinite}
.node.current:before{content:'';position:absolute;inset:-9px;border-radius:50%;border:5px solid var(--nc);opacity:.35}
.node .ring{position:absolute;inset:-9px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.bubble{position:absolute;top:-38px;background:#fff;color:var(--nc2,#58cc02);font-weight:900;font-size:13px;padding:6px 12px;border-radius:12px;white-space:nowrap;letter-spacing:.5px;animation:bob 1.6s ease-in-out infinite;z-index:2;box-shadow:0 3px 0 #0003}
.bubble:after{content:'';position:absolute;bottom:-6px;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:#fff;border-bottom:0}
.nlabel{margin-top:12px;font-size:11.5px;color:var(--mut);font-weight:800;max-width:130px;text-align:center;line-height:1.2}
.nstars{font-size:11px;letter-spacing:1px;margin-top:2px}
.nstars .on{color:var(--gold)} .nstars .off{color:#3a4064}

/* ---------- bottom nav (glass + raised FAB, like Jazz) ---------- */
.nav{position:absolute;left:0;right:0;bottom:0;height:calc(70px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;align-items:center;justify-content:space-around;
  background:rgba(13,16,32,.78);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid #ffffff10;z-index:20}
.nav button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;opacity:.5;font-size:10px;letter-spacing:.6px;font-weight:900}
.nav button.on{opacity:1}
.nav button .ni{font-size:22px}
.nav .fab{opacity:1}
.nav .fab .ni{width:54px;height:54px;margin-top:-30px;border-radius:18px;display:grid;place-items:center;font-size:26px;
  background:linear-gradient(145deg,var(--blue),#7c6cff);box-shadow:0 5px 0 #4b3fc0,0 0 24px #7c6cff88;animation:fabglow 3s ease-in-out infinite}
@keyframes fabglow{0%,100%{box-shadow:0 5px 0 #4b3fc0,0 0 18px #1cb0f688}50%{box-shadow:0 5px 0 #4b3fc0,0 0 30px #ce82ffaa}}

/* ---------- buttons ---------- */
.btn{border:none;border-radius:16px;padding:15px 18px;font-size:16px;font-weight:900;letter-spacing:.8px;color:#fff;width:100%;
  background:var(--b,var(--green));box-shadow:0 5px 0 var(--bs,var(--greenS));transition:transform .06s,box-shadow .06s,filter .15s;text-transform:uppercase}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--bs,var(--greenS))}
.btn:disabled{--b:#2b3150;--bs:#1d2139;color:#6b7299}
.btn.blue{--b:var(--blue);--bs:var(--blueS)} .btn.red{--b:var(--red);--bs:var(--redS)} .btn.gold{--b:var(--gold);--bs:var(--goldS);color:#3a2a00}
.btn.ghost{--b:transparent;--bs:transparent;box-shadow:none;border:2px solid var(--line);color:var(--mut)}
.btn.sm{padding:10px 14px;font-size:13px;width:auto;border-radius:12px}
.mini{background:var(--card2);border:none;border-radius:10px;min-width:34px;height:32px;font-size:14px;box-shadow:0 3px 0 #0005}
.mini:active:not(:disabled){transform:translateY(2px);box-shadow:none}
.mini:disabled{opacity:.25}
.linkbtn{background:none;border:none;color:var(--mut);font-size:13px;padding:8px;text-decoration:underline}

/* ---------- lesson player ---------- */
.lhead{display:flex;align-items:center;gap:12px;padding:14px 16px}
.lhead .x{background:none;border:none;font-size:24px;color:var(--mut);width:32px}
.pbar{flex:1;height:16px;border-radius:10px;background:#2a3052;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:10px;background:var(--green);transition:width .35s cubic-bezier(.3,1.4,.6,1);position:relative}
.pbar i:after{content:'';position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:3px;background:#ffffff55}
.timer{font-weight:900;color:var(--blue);font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.lbody{flex:1;overflow-y:auto;padding:4px 18px 20px}
.lfoot{padding:14px 18px calc(16px + env(safe-area-inset-bottom));border-top:2px solid #ffffff0a;transition:background .2s}
.kind{font-size:12px;font-weight:900;letter-spacing:1.5px;color:var(--purple);margin:6px 0 6px}
.qh{font-size:21px;font-weight:900;line-height:1.25;margin:4px 0 16px}
.qh b{color:var(--blue)}
.ptext{font-size:16.5px;line-height:1.55;font-weight:600;color:#dfe3ff}
.ptext b{color:#fff;font-weight:900}
.pill{display:inline-block;font-family:var(--mono);font-size:13px;font-weight:700;padding:3px 9px;border-radius:9px;margin:3px 4px 3px 0;background:#ffffff14}
.pill.g{background:#58cc0233;color:#9bf05a}.pill.b{background:#1cb0f633;color:#8ad8ff}.pill.p{background:#ce82ff33;color:#e5bfff}.pill.y{background:#ffc80033;color:#ffe27a}
.c1{color:var(--red)}.c2{color:var(--purple)}.c3{color:var(--teal)}.c4{color:#8a91b4}.c5{color:var(--blue)}.c6{color:var(--orange)}.c7{color:var(--green)}
.pop{animation:popin .35s cubic-bezier(.3,1.5,.6,1)}
@keyframes popin{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}

pre.code{font-family:var(--mono);font-size:12.6px;line-height:1.55;background:#0a0c18;border:2px solid #ffffff10;border-radius:14px;padding:12px 14px;overflow-x:auto;margin:12px 0;white-space:pre;font-weight:500}
pre.code.sm{font-size:11.5px;padding:10px 12px}
.k{color:#ff7ab6;font-weight:700}.ty{color:#8ad8ff}.ty2{color:#ffd166}.st{color:#a3e635}.as{color:#ffb86b}.pa{color:#c4a7ff}.nu{color:#ffcf6b}.cm{color:#6b7299;font-style:italic}.mod{color:#2bd9c4}

/* options */
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;font-size:15.5px;font-weight:800;box-shadow:0 4px 0 var(--line);transition:transform .06s}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt .n{flex:none;width:28px;height:28px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--mut)}
.opt.sel{border-color:var(--blue);background:#1cb0f61a;box-shadow:0 4px 0 var(--blueS)}
.opt.sel .n{border-color:var(--blue);color:var(--blue)}
.opt.right{border-color:var(--green);background:#58cc021f;box-shadow:0 4px 0 var(--greenS)}
.opt.wrong{border-color:var(--red);background:#ff4b4b1f;box-shadow:0 4px 0 var(--redS)}
.opt code{font-size:.82em}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf .opt{justify-content:center;font-size:20px;padding:24px 10px}

/* tap tokens */
.tok{background:#ffffff10;border:2px dashed #ffffff40;border-radius:6px;padding:0 4px;font:inherit;color:inherit;margin:0 1px}
.tok.sel{background:#1cb0f644;border:2px solid var(--blue)}
.tok.right{background:#58cc0244;border-color:var(--green)} .tok.wrong{background:#ff4b4b44;border-color:var(--red)}

/* order + fill chips */
.ansline{min-height:62px;border-bottom:2px solid var(--line);border-top:2px solid var(--line);padding:10px 0;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px;align-content:flex-start}
.ansline.col{flex-direction:column;flex-wrap:nowrap}
.bank{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
.bank.col{flex-direction:column;align-items:stretch}
.wchip{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 13px;font-size:14.5px;font-weight:800;box-shadow:0 4px 0 var(--line);font-family:inherit}
.wchip.mono{font-family:var(--mono);font-size:12.5px;font-weight:600;text-align:left}
.wchip:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.wchip.ghost{visibility:hidden}
.wchip.used{background:#ffffff08;color:transparent;box-shadow:none;border-style:dashed}
.wchip .ix{display:inline-block;color:var(--blue);margin-right:6px;font-family:var(--mono)}
.slot{display:inline-block;min-width:64px;border-bottom:3px solid var(--blue);text-align:center;padding:0 4px;margin:0 2px;color:var(--gold);cursor:pointer;border-radius:4px 4px 0 0}
.slot.blank{color:transparent;background:#1cb0f61a}
.slot.next{animation:blink 1s infinite}
@keyframes blink{50%{background:#1cb0f640}}
.slot.right{border-color:var(--green);color:#9bf05a}.slot.wrong{border-color:var(--red);color:#ff9a9a}

/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.mcell{min-height:56px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px;font-size:14px;font-weight:800;box-shadow:0 4px 0 var(--line);line-height:1.2}
.mcell.l{font-family:var(--mono);font-size:13px;font-weight:600}
.mcell.sel{border-color:var(--blue);background:#1cb0f61a;box-shadow:0 4px 0 var(--blueS)}
.mcell.ok{border-color:#58cc0255;color:#58cc0277;background:#58cc020d;box-shadow:none;pointer-events:none}
.mcell.bad{border-color:var(--red);background:#ff4b4b22;animation:shake .3s}

/* feedback sheet */
.lfoot.good{background:#1c3a12} .lfoot.bad{background:#3d1717}
.fb{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.fb .fi{width:44px;height:44px;flex:none;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:24px}
.fb h3{margin:2px 0 4px;font-size:20px;font-weight:900}
.good .fb h3{color:#9bf05a} .bad .fb h3{color:#ff8c8c}
.fb p{margin:0;font-size:14px;line-height:1.4;color:#e8ebff;font-weight:600}
.fb .ans{font-family:var(--mono);font-size:13px;color:#fff;margin-bottom:4px;font-weight:600}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

/* widgets */
.widget{background:var(--card);border-radius:18px;padding:12px;border:2px solid var(--line);display:flex;flex-direction:column;gap:12px;margin-top:12px}
.vpwrap{border-radius:14px;overflow:hidden;background:#090b16}
svg.vp{display:block;width:100%;height:auto}
svg.vp .grid line{stroke:#ffffff08;stroke-width:1}
.vlabel{fill:#ffffffaa;font-size:11px;font-weight:800;text-anchor:middle;font-family:'Nunito',sans-serif}
.morph *{transition:all .35s cubic-bezier(.3,1.3,.6,1)}
.popin{animation:popin .35s cubic-bezier(.3,1.5,.6,1);transform-box:fill-box;transform-origin:center}
.tree{display:flex;flex-direction:column;gap:2px}
.trow{background:none;border:none;text-align:left;padding:7px 10px;border-radius:10px;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:13px;font-weight:600}
.trow.on{background:#1cb0f62a;color:#8ad8ff}
.tico{color:var(--mut);font-size:11px} .ttype{margin-left:auto;color:var(--mut);font-size:11px;font-family:'Nunito';font-weight:800}
.treeinfo{background:#0a0c18;border-radius:12px;padding:10px 12px;min-height:60px}
.bigpath{font-family:var(--mono);color:var(--gold);font-size:16px;margin-bottom:6px;word-break:break-all}
.props{margin-top:6px;font-size:13px;display:flex;flex-direction:column;gap:3px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--card2);border:2px solid var(--line);border-radius:11px;padding:7px 12px;font-size:13px;box-shadow:0 3px 0 #0006;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 3px 0 var(--blueS)}
.chip:active{transform:translateY(2px);box-shadow:none}
.specrows{display:flex;flex-direction:column;gap:8px}
.specrow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.oplist{display:flex;flex-direction:column;gap:6px}
.oprow{display:flex;align-items:center;gap:10px;background:#0a0c18;border-radius:12px;padding:7px 10px}
.opi{width:22px;height:22px;border-radius:7px;background:var(--gold);color:#3a2a00;display:grid;place-items:center;font-size:12px;font-weight:900}
.opbtns{margin-left:auto;display:flex;gap:6px}
.sliders{display:flex;flex-direction:column;gap:6px}
.sl{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mut)} .sl span{width:78px}
input[type=range]{flex:1;accent-color:var(--blue);height:28px}
input[type=range].big{width:100%}
.readout{background:#0a0c18;border-radius:12px;padding:10px 12px;font-size:14px;text-align:center}
.readout .big{font-size:26px;color:var(--gold)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.toggle{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer;background:#0a0c18;border-radius:12px;padding:10px 12px}
.toggle input{width:22px;height:22px;accent-color:var(--green)}
.toggle.big{font-size:16px;font-family:var(--mono)}
.stack{display:flex;flex-direction:column;gap:6px}
.stackhead{font-size:10px;letter-spacing:1.5px;color:var(--mut);text-align:center;font-weight:900}
.layer{display:flex;align-items:center;gap:8px;background:#0a0c18;border-radius:12px;padding:8px 10px;border-left:5px solid;transition:opacity .2s}
.layer.muted{opacity:.35}
.lname{flex:1;min-width:0} .lname b{font-family:var(--mono);font-size:12.5px;font-weight:600}
.lchips{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.opchip{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:3px 7px;font-size:11px;font-family:var(--mono);font-weight:600;display:inline-flex;gap:4px;align-items:center}
.opchip.none{color:var(--mut);border-style:dashed}
.lbtns{display:flex;gap:5px}
.sw{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:4px}
.sw.lg{width:26px;height:26px;border-radius:8px;margin:0}
.resolved{background:#0a0c18;border-radius:12px;padding:8px 12px}
.rh{font-size:10px;letter-spacing:1.5px;color:var(--mut);margin-bottom:4px;font-weight:900}
.rrow{display:grid;grid-template-columns:62px 1fr auto;gap:8px;font-size:13px;padding:3px 0;align-items:center}
.win{font-size:11.5px;font-family:var(--mono)}
.bigswatch{height:84px;border-radius:16px;display:grid;place-items:center;font-size:18px;font-weight:900;color:#fff;text-shadow:0 2px 0 #0004;transition:background .3s;box-shadow:inset 0 -6px 0 #0002}
.arc{display:flex;align-items:center;gap:12px;width:100%;background:#0a0c18;border:2px solid transparent;border-radius:12px;padding:8px 10px;margin-bottom:6px;opacity:.5}
.arc.on{opacity:1} .arc.win{border-color:#fff}
.arc.na{opacity:.4;border-style:dashed;border-color:#ffffff22}
.arck{width:30px;height:30px;border-radius:9px;background:var(--card2);display:grid;place-items:center;font-weight:900}
.arcn{flex:1;text-align:left}
.mem{position:relative;height:30px;background:#0a0c18;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:13px}
.memfill{position:absolute;left:0;top:0;bottom:0;background:var(--orange);transition:width .4s,background .3s;opacity:.85}
.mem span{position:relative;font-weight:900;text-shadow:0 1px 2px #000}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pbtn{background:#0a0c18;border:2px dashed #ffffff30;border-radius:12px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:2px}
.pbtn span{font-size:11px;color:var(--mut)}
.pbtn.on{border:2px solid var(--blue);background:#1cb0f61a}
.pbtn.ref{border:2px solid #ffffff22;opacity:.8}
.brow{display:flex;align-items:center;gap:10px;width:100%;background:#0a0c18;border:2px solid transparent;border-radius:12px;padding:8px 12px;margin-bottom:5px;text-align:left}
.brow.on{border-color:var(--blue)} .brow code{background:none;padding:0}
.bmat{margin-left:auto;font-size:13px}
.brow .small{min-width:90px;text-align:right}

/* review / lab / glossary */
.page{padding:6px 16px 110px}
.h1{font-size:24px;font-weight:900;margin:8px 0 4px}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;margin:14px 0}
.mix{background:linear-gradient(135deg,#ff9600,#ff4b4b);border:none;box-shadow:0 6px 0 #b8342c;color:#fff}
.mix h3{margin:0 0 4px;font-size:20px;font-weight:900}
.mix p{margin:0 0 14px;color:#ffffffe0;font-size:14px}
.week{display:flex;justify-content:space-between;margin-top:10px}
.day{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--mut)}
.day i{width:30px;height:30px;border-radius:50%;background:#2a3052;display:grid;place-items:center;font-style:normal;font-size:14px}
.day.hit i{background:var(--orange);box-shadow:0 0 12px #ff960088}
.day.today{color:#fff}
.bigstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bs{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center}
.bs b{display:block;font-size:22px;font-weight:900}
.bs span{font-size:11px;color:var(--mut);letter-spacing:.5px}
.gsearch{width:100%;background:#0a0c18;border:2px solid var(--line);border-radius:14px;padding:12px 14px;color:#fff;font:inherit;font-size:15px;margin-bottom:10px}
.gitem{border-bottom:1px solid #ffffff0d;padding:11px 2px}
.gitem b{color:var(--blue);font-size:15px} .gitem div{font-size:14px;color:#cdd2f0;margin-top:3px;font-weight:600;line-height:1.4}
.weak{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #ffffff0d;font-size:14px}
.weak .wn{margin-left:auto;color:var(--red);font-weight:900}
.labtabs{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 12px;scrollbar-width:none}
.labtabs::-webkit-scrollbar{display:none}
.labtabs .chip{flex:none}

/* sheets / modals */
.scrim{position:absolute;inset:0;background:#000a;z-index:50;display:flex;align-items:flex-end;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;background:var(--card);border-radius:26px 26px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.3,1.2,.6,1);max-height:90%;overflow-y:auto}
@keyframes up{from{transform:translateY(100%)}}
.sheet h2{margin:0 0 6px;font-size:22px;font-weight:900}
.setrow{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid #ffffff0d;font-size:15px}
.sw2{width:52px;height:30px;border-radius:15px;background:#3a4064;border:none;position:relative;transition:background .2s}
.sw2:after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.sw2.on{background:var(--green)} .sw2.on:after{left:25px}
.toast{position:absolute;left:50%;top:calc(20px + env(safe-area-inset-top));transform:translateX(-50%);background:#fff;color:#111;font-weight:800;padding:10px 16px;border-radius:14px;z-index:99;font-size:14px;box-shadow:0 6px 20px #0008;animation:tdrop .3s cubic-bezier(.3,1.4,.6,1);max-width:90%;text-align:center}
@keyframes tdrop{from{transform:translate(-50%,-30px);opacity:0}}

/* results */
.results{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:6px}
.results .trophy{font-size:84px;animation:popin .6s cubic-bezier(.3,1.6,.5,1)}
.results h1{font-size:30px;font-weight:900;margin:6px 0;color:var(--gold)}
.rstars{font-size:46px;letter-spacing:6px;margin:4px 0 10px}
.rstars span{display:inline-block;color:#3a4064}
.rstars span.on{color:var(--gold);animation:starpop .5s cubic-bezier(.3,1.8,.5,1) both;text-shadow:0 0 20px #ffc80088}
@keyframes starpop{from{transform:scale(0) rotate(-90deg)}}
.rboxes{display:flex;gap:10px;width:100%;margin:14px 0 24px}
.rbox{flex:1;border-radius:16px;border:2px solid var(--c);overflow:hidden}
.rbox .t{background:var(--c);color:#111;font-size:11px;font-weight:900;padding:4px;letter-spacing:.8px}
.rbox .v{padding:12px 4px;font-size:22px;font-weight:900;color:var(--c)}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.empty{text-align:center;padding:30px 10px;color:var(--mut)}
.empty .big{font-size:50px}

/* callouts + part headers */
.tip,.hou,.warn{margin-top:12px;padding:10px 12px;border-radius:12px;font-size:14.5px;line-height:1.45}
.tip{background:#1cb0f61c;border-left:4px solid var(--blue)}
.hou{background:#ff96001c;border-left:4px solid var(--orange)}
.warn{background:#ff4b4b1c;border-left:4px solid var(--red)}
.parthead{margin:26px 14px 6px;padding:16px 16px 14px;border-radius:20px;background:linear-gradient(135deg,color-mix(in srgb,var(--pc) 35%,#0d1020),#141830);border:2px solid color-mix(in srgb,var(--pc) 60%,transparent);text-align:center}
.parthead .pt{font-weight:900;font-size:15px;letter-spacing:1.5px;color:#fff}
.parthead .ps{font-size:12.5px;color:#cdd2f0;margin-top:3px}
.pbar2{height:8px;border-radius:5px;background:#0006;margin:10px 0 6px;overflow:hidden}
.pbar2 i{display:block;height:100%;background:var(--pc);border-radius:5px}
.parthead .pn{font-size:11px;color:var(--mut);font-weight:800}
/* lop layer sim */
.chain{display:flex;flex-direction:column;gap:6px}
.lopn{display:flex;align-items:center;gap:10px;background:#0a0c18;border:2px solid #ffffff14;border-radius:12px;padding:8px 10px;text-align:left;width:100%}
.lopn .lc{width:10px;align-self:stretch;border-radius:4px}
.lopn .lt{font-size:11px;color:var(--mut)} .lopn b{font-family:var(--mono);font-size:12.5px;font-weight:600}
.lopn.off{opacity:.35} .lopn.disp{border-color:var(--blue)}
.lopn .flag{margin-left:auto;font-size:11px;color:var(--blue);font-weight:900}
.lstack .lay{border-left:5px solid;background:#0a0c18;border-radius:10px;padding:7px 10px;margin-bottom:5px;font-size:12.5px}
.lstack .lay b{font-family:var(--mono);font-weight:600}
.badge{display:inline-block;font-size:10px;font-weight:900;padding:2px 6px;border-radius:6px;margin-left:5px;background:#ffffff14;letter-spacing:.4px}
.badge.act{background:var(--green);color:#0b2a00}.badge.disk{background:#ce82ff44}.badge.nos{background:#ff4b4b44}
/* pattern tester */
.ptin{width:100%;background:#0a0c18;border:2px solid var(--line);border-radius:12px;padding:10px 12px;color:#fff;font-family:var(--mono);font-size:13px}
.prow{font-family:var(--mono);font-size:12px;padding:3px 8px;border-radius:7px;display:flex;justify-content:space-between;gap:6px}
.prow.hit{background:#58cc0233;color:#bff58f}
.prow span{color:var(--mut);font-family:'Nunito';font-weight:800;font-size:10.5px}

</style>

<div id="app"></div>
<script>
// ============================================================
//  CURRICULUM — PART 1: FOUNDATIONS
//  Step / question types:
//   info   {h, p(html), code?, lang?, after?(html after code)}
//   widget {w, h, p}
//   mcq    {q, code?, o:[], a, why}
//   tf     {q, a:bool, why}
//   tap    {q, code (tappables in ⟦ ⟧), a:index, why}
//   order  {q, items:[correct order], why}
//   match  {q, pairs:[[l,r]]}
//   fill   {q, code (blanks = ▢), blanks:[], extra:[], why}
//  Rule: every question is answerable from cards that come BEFORE it.
// ============================================================
const PARTS = {
  p1: { title: 'PART 1 · FOUNDATIONS', sub: 'What USD is and how a scene is described', color: '#58cc02' },
  p2: { title: 'PART 2 · COMPOSITION', sub: 'Layers, arcs and how opinions combine', color: '#ff4b4b' },
  p3: { title: 'PART 3 · SCENE DOMAINS', sub: 'Geometry, primvars, models, instancing, shading, lights, render', color: '#1cb0f6' },
  p4: { title: 'PART 4 · CODE & TOOLS', sub: 'The Python API and the command-line toolbox', color: '#ff9600' },
  p5: { title: 'PART 5 · HOUDINI SOLARIS', sub: 'USD the Houdini way: LOPs, Karma and the pipeline', color: '#7c6cff' },
};

const UNITS = [];

// ------------------------------------------------------------ U1
UNITS.push({
  id: 'u1', part: 'p1', title: 'WHAT IS USD?', sub: 'The problem it solves and the big idea', emoji: '🌱', color: '#58cc02', shadow: '#46a302',
  items: [
    { id: 'u1l1', kind: 'lesson', title: 'Why USD exists', steps: [
      { t: 'info', h: 'The problem', p: `Making an animated film or a game means hundreds of artists working on the <b>same scene</b> at once: modellers, layout, animators, FX, lighters. Each of them uses different tools (Houdini, Maya, Blender…).<br><br>The traditional approach is "export a file, hand it on". Somebody always overwrites somebody else, and the files get huge.` },
      { t: 'info', h: 'Pixar\'s answer', p: `<b>Universal Scene Description</b> (USD, now <b>OpenUSD</b>) is Pixar's open-source answer. It's two things at once:<br><br>1️⃣ A <b>way of describing 3D scenes</b>: geometry, transforms, materials, lights, cameras, animation.<br>2️⃣ A <b>C++/Python library</b> that reads many of those descriptions and <b>composes</b> them into one scene, very fast.<br><br>You can think of it as "Git + Photoshop layers" for 3D scenes.` },
      { t: 'info', h: 'The big idea: opinions in layers', p: `Nobody edits the original asset. Each person writes their changes into their <b>own file</b>, called a <b>layer</b>. Every value they write is called an <b>opinion</b>.<br><br>USD stacks the layers and works out the final answer: when two layers disagree, the <b>stronger opinion wins</b>.<br><br>So lighting can make the car red <b>without touching</b> the modeller's file. If lighting deletes its layer, the car goes back to its original colour. That's what <b>non-destructive</b> means.` },
      { t: 'mcq', q: 'In USD, what is an <b>opinion</b>?', o: ['A comment in a file', 'Any value authored in a layer', 'A user\'s rating of an asset', 'A render setting'], a: 1, why: 'Every authored value (attribute value, metadata, relationship target) is an opinion. Composition decides which opinion wins.' },
      { t: 'tf', q: 'To change the colour of a car, a lighter must edit the modeller\'s file.', a: false, why: 'They write an opinion into their own, stronger layer. The modeller\'s file is never touched.' },
      { t: 'info', h: 'Who uses it', p: `USD started at Pixar, was open-sourced in 2016, and is now an industry standard governed by the <b>Alliance for OpenUSD (AOUSD)</b>. Houdini (Solaris), Maya, Blender, Unreal, Omniverse and Apple's AR tools all read and write it.<br><br><div class="hou">🟠 <b>Houdini:</b> Houdini's whole USD toolset is called <b>Solaris</b>, and it lives in the <code>/stage</code> network. You'll get a huge chapter on it at the end of this course.</div>` },
      { t: 'info', h: 'Key takeaways', p: `• USD = a scene description <b>and</b> a library that composes scenes<br>• Work lives in <b>layers</b>, and each value is an <b>opinion</b><br>• Stronger opinions win, so originals stay untouched (<b>non-destructive</b>)` },
    ]},
    { id: 'u1l2', kind: 'lesson', title: 'Files & formats', steps: [
      { t: 'info', h: 'Three flavours of file', p: `<div class="pills"><span class="pill g">.usda</span> <b>ASCII text</b>. Human-readable, great for learning and debugging.<br><span class="pill b">.usdc</span> <b>"Crate" binary</b>. Compact and fast, the default for big data.<br><span class="pill p">.usdz</span> an <b>uncompressed zip package</b> of USD files plus textures, used for delivery and AR.</div><br><span class="pill y">.usd</span> can hold <b>either</b> text or crate. The library sniffs the contents, so you can switch formats without renaming files or breaking references.` },
      { t: 'info', h: 'Why crate is fast', p: `When you open a <code>.usdc</code> file, USD reads a small <b>index</b> first and only loads the data you actually ask for (it can memory-map the file). Values are <b>deduplicated</b>, so repeated arrays are stored once.<br><br>Text and crate are <b>losslessly convertible</b>: you can turn a .usdc into .usda, read it, and turn it back.<div class="tip">💡 Editing a crate file in place <i>appends</i> data, so it can grow. Running it through <code>usdcat</code> rewrites it compactly.</div>` },
      { t: 'match', q: 'Match the extension to what it is.', pairs: [['.usda', 'Text'], ['.usdc', 'Binary crate'], ['.usdz', 'Zip package'], ['.usd', 'Either text or crate']] },
      { t: 'mcq', q: 'You want to open a file in a text editor and read it. Which extension?', o: ['.usdc', '.usda', '.usdz', '.abc'], a: 1, why: '.usda is guaranteed text. .usdc is binary and .usdz is a zip.' },
      { t: 'tf', q: 'A file ending in .usd is always binary.', a: false, why: '.usd can be either text or crate. Only .usda and .usdc force a format.' },
      { t: 'info', h: 'Not just USD files', p: `USD reads other formats through <b>file format plugins</b>. Alembic (<code>.abc</code>), MaterialX (<code>.mtlx</code>), OBJ and others can be opened as if they were USD layers.<br><br><div class="hou">🟠 <b>Houdini:</b> sublayering or referencing an <code>.abc</code> in LOPs uses USD's Alembic plugin, not Houdini's own Alembic code.</div>` },
      { t: 'info', h: 'Key takeaways', p: `• <b>.usda</b> = text, <b>.usdc</b> = binary crate, <b>.usdz</b> = package, <b>.usd</b> = either<br>• Crate is lazy-loaded, deduplicated and losslessly convertible to text<br>• Plugins let USD read Alembic, MaterialX and more` },
    ]},
    { id: 'u1l3', kind: 'lesson', title: 'Your first look', steps: [
      { t: 'info', h: 'A tiny scene', lang: 'usda', code: `#usda 1.0\n(\n    defaultPrim = "World"\n    upAxis = "Y"\n    metersPerUnit = 0.01\n)\n\ndef Xform "World"\n{\n    def Sphere "Ball"\n    {\n        double radius = 2\n    }\n}`, p: 'This is a complete, valid USD file. It describes a sphere called Ball inside a group called World.', after: 'Don\'t worry about every symbol yet. The next units take it apart piece by piece.' },
      { t: 'info', h: 'The stage', p: `When USD opens a file, it builds a <b>stage</b>: the fully composed scene, with every layer and arc already resolved. You never query files directly. You ask the stage.<br><br>In Python: <code>stage = Usd.Stage.Open('scene.usda')</code>` },
      { t: 'mcq', q: 'What is a <b>stage</b>?', o: ['A single USD file on disk', 'The composed scene built from a root layer and everything it pulls in', 'A render pass', 'The Houdini viewport'], a: 1, why: 'A stage is the result of composing a root layer with everything it references, sublayers and so on.' },
      { t: 'info', h: 'Try it on your machine', lang: 'py', code: `# in your usd_learning venv (usd-core is installed)\nfrom pxr import Usd\nprint(Usd.GetVersion())\n\nstage = Usd.Stage.CreateInMemory()\nstage.DefinePrim('/World/Ball', 'Sphere')\nprint(stage.GetRootLayer().ExportToString())`, p: 'Paste this into Python in your venv, or into Houdini\'s Python Shell.', after: 'You\'ll see USD write the .usda text for the prims you just created.' },
      { t: 'info', h: 'Key takeaways', p: `• A USD file is plain text you can read (in .usda form)<br>• Opening it produces a <b>stage</b>, the composed scene you query<br>• The Python modules live in the <code>pxr</code> package` },
    ]},
    { id: 'u1d1', kind: 'drill', title: 'Basics drill', steps: [
      { t: 'mcq', q: 'What does "non-destructive" mean in USD?', o: ['Files can\'t be deleted', 'Changes go into separate layers, so originals are never edited', 'Renders never crash', 'Undo is unlimited'], a: 1, why: 'Overrides live in their own layers above the source.' },
      { t: 'match', q: 'Match.', pairs: [['Layer', 'A file of opinions'], ['Opinion', 'One authored value'], ['Stage', 'The composed scene'], ['Solaris', 'Houdini\'s USD toolset']] },
      { t: 'tf', q: 'Text and crate files can be converted into each other without losing data.', a: true, why: 'They are lossless representations of the same data.' },
      { t: 'mcq', q: 'Which format would you hand to an iPhone AR viewer?', o: ['.usda', '.usdc', '.usdz', '.mtlx'], a: 2, why: '.usdz is the packaged, single-file delivery format.' },
      { t: 'tf', q: 'USD can only read files in its own formats.', a: false, why: 'File format plugins let it read Alembic, MaterialX, OBJ and more.' },
    ]},
  ]
});

// ------------------------------------------------------------ U2
UNITS.push({
  id: 'u2', part: 'p1', title: 'PRIMS & NAMESPACE', sub: 'Prims, paths, properties, specifiers', emoji: '🌳', color: '#58cc02', shadow: '#46a302',
  items: [
    { id: 'u2l1', kind: 'lesson', title: 'Prims & properties', steps: [
      { t: 'info', h: 'Prims', p: `A <b>prim</b> (short for primitive) is the basic building block of a USD scene. It's a <b>node in a hierarchy</b>, a bit like a folder. A prim can hold:<br><br>• <b>child prims</b><br>• <b>properties</b> (the real data)<br>• <b>metadata</b> (extra info about the prim itself)<br><br>Prims are also the unit of instancing, loading and deactivation, as you'll see later.` },
      { t: 'info', h: 'Two kinds of property', p: `<span class="pill g">attribute</span> holds a <b>typed value</b>, possibly animated over time.<br><code>double radius = 2</code><br><br><span class="pill b">relationship</span> <b>points at</b> other prims or properties by path. It never holds a value.<br><code>rel material:binding = &lt;/Mats/Red&gt;</code><br><br>Relationships are how USD says "this mesh uses that material" or "this light lights those objects".` },
      { t: 'widget', w: 'stageTree', h: 'Explore a stage', p: 'Tap prims to see their path, type and properties.' },
      { t: 'mcq', q: 'Which property kind would store <code>radius = 2.5</code>?', o: ['Relationship', 'Attribute', 'Metadata', 'Specifier'], a: 1, why: 'Values live in attributes. Relationships only store target paths.' },
      { t: 'tap', q: 'Tap the <b>relationship</b>.', code: `def Sphere "Ball"\n{\n    double ⟦radius⟧ = 2\n    ⟦rel material:binding⟧ = </Mats/Red>\n    token ⟦visibility⟧ = "inherited"\n}`, a: 1, why: 'Relationships are declared with "rel" and their targets are paths in < >.' },
      { t: 'info', h: 'Namespaced names', p: `Property names can contain colons to group them into <b>namespaces</b>: <code>material:binding</code>, <code>primvars:displayColor</code>, <code>inputs:diffuseColor</code>, <code>xformOp:translate</code>.<br><br>The colon is part of the name. It just keeps related properties together.` },
      { t: 'info', h: 'Key takeaways', p: `• <b>Prim</b> = a node in the scene tree<br>• <b>Attribute</b> = typed value. <b>Relationship</b> = pointer to paths<br>• Colons group property names into namespaces` },
    ]},
    { id: 'u2l2', kind: 'lesson', title: 'Paths', steps: [
      { t: 'info', h: 'Every prim has an address', p: `The tree of prims is called the <b>namespace</b>. Every prim has a unique <b>path</b> written with forward slashes, starting at the root:<br><br><code class="big">/World/Car/Wheel_FL</code><br><br>In .usda text, a path used as a value is wrapped in angle brackets: <code>&lt;/World/Car&gt;</code>.` },
      { t: 'info', h: 'The pseudo-root', p: `Above all your top-level prims sits a hidden <b>pseudo-root</b> whose path is just <code>/</code>. It turns the scene into a single tree, which makes traversal simple.<br><br>Prims directly under it (like <code>/World</code>) are called <b>root prims</b>.` },
      { t: 'info', h: 'Property paths', p: `To address a <b>property</b>, add a dot and its name:<br><br><code class="big">/World/Ball.radius</code><br><code class="big">/World/Ball.primvars:displayColor</code><br><br>Paths can even point inside a variant, using braces: <code>/Car{paint=red}Body</code>. You'll meet variants in Part 2.` },
      { t: 'mcq', q: 'Which is the path to the <b>radius</b> attribute of <b>Ball</b> under <b>World</b>?', o: ['/World/Ball/radius', '/World/Ball.radius', 'World.Ball.radius', '/World:Ball.radius'], a: 1, why: 'Prims are separated by "/" and the property is joined with ".".' },
      { t: 'mcq', q: 'What is the path of the pseudo-root?', o: ['/World', '/', '/root', '.'], a: 1, why: 'The pseudo-root is "/", the parent of every root prim.' },
      { t: 'info', h: 'Naming rules', p: `Prim names must be valid identifiers: letters, digits and underscores, and no spaces. They can't start with a digit (USD now also allows many Unicode letters).<br><br><code>Wheel_FL</code> ✅ &nbsp; <code>2Wheels</code> ❌ &nbsp; <code>my wheel</code> ❌<div class="hou">🟠 <b>Houdini:</b> when SOP geometry is imported, illegal characters in path names are replaced, usually with underscores.</div>` },
      { t: 'tf', q: '<code>/World/Front Door</code> is a valid prim path.', a: false, why: 'Spaces are not allowed in prim names. Use Front_Door.' },
      { t: 'info', h: 'Key takeaways', p: `• Paths look like <code>/A/B/C</code> and are unique<br>• <code>/</code> is the pseudo-root. Root prims sit directly under it<br>• A property path adds <code>.name</code>` },
    ]},
    { id: 'u2l3', kind: 'lesson', title: 'def, over & class', steps: [
      { t: 'info', h: 'Specifiers', p: `Every prim description in a layer starts with a <b>specifier</b> that states the author's intent:<br><br><span class="pill g">def</span> <b>defines</b> the prim: "this exists".<br><span class="pill b">over</span> an <b>override</b>: "<i>if</i> this prim exists, here are my opinions". It's the weakest specifier and doesn't make the prim exist on its own.<br><span class="pill p">class</span> an <b>abstract</b> prim: a template that others inherit from. It isn't traversed or rendered.` },
      { t: 'widget', w: 'specifiers', h: 'Toggle the specifier', p: 'Change each prim\'s specifier and watch what appears in the viewport.' },
      { t: 'info', h: 'How specifiers combine', p: `Several layers can describe the same prim with different specifiers. If <b>any</b> layer says <code>def</code>, the prim is defined, so an <code>over</code> on top of a <code>def</code> still gives you a real prim.<br><br>If <b>every</b> layer only says <code>over</code>, the prim is "undefined": default traversals skip it and it won't render.<br><br>A <code>class</code> prim and <b>everything under it</b> count as abstract.` },
      { t: 'mcq', q: 'A lighting layer only wants to change the colour of /World/Car, which the layout layer defines. Which specifier should lighting use?', o: ['def', 'over', 'class'], a: 1, why: '"over" adds opinions without claiming the prim exists. If layout later removes the car, lighting won\'t accidentally resurrect it.' },
      { t: 'tf', q: 'An "over" with nothing defining the prim underneath shows up in the render.', a: false, why: 'An over alone leaves the prim undefined, and default traversal skips it.' },
      { t: 'tap', q: 'Tap the prim that will <b>not</b> be drawn.', code: `def Xform "World" {\n    def Sphere ⟦"Ball"⟧ {}\n}\nclass Xform ⟦"_class_Tree"⟧ {}\ndef Cube ⟦"Box"⟧ {}`, a: 1, why: 'class prims are abstract, so they aren\'t rendered. The _class_ prefix is only a naming convention.' },
      { t: 'info', h: 'Key takeaways', p: `• <b>def</b> defines, <b>over</b> only overrides, <b>class</b> is an abstract template<br>• Any def anywhere makes the prim real<br>• Studios often name classes <code>_class_Something</code>, but that's just convention` },
    ]},
    { id: 'u2l4', kind: 'lesson', title: 'Active & visible', steps: [
      { t: 'info', h: 'USD never deletes', p: `Since all edits are opinions in layers, you can't really "delete" a prim that a weaker layer defines. Instead you have two switches:<br><br><span class="pill y">active</span> <b>metadata</b>. Setting <code>active = false</code> removes the prim <b>and all its descendants</b> from the composed stage. Their children aren't even composed, which saves memory.<br><br><span class="pill b">visibility</span> an <b>attribute</b> with two values, <code>inherited</code> (the default) and <code>invisible</code>. Invisible hides the prim and everything below it from rendering, but it all still exists and can be inspected.` },
      { t: 'info', h: 'Which one to use?', p: `• Want it <b>gone</b> (and cheaper)? → deactivate.<br>• Want it <b>hidden</b> but still there, for example for a camera to aim at, or to animate it popping in? → <code>visibility = "invisible"</code>. Visibility <b>can be animated</b>; activation can't.<br><br>A stronger layer can set <code>active = true</code> again to bring a prim back.<div class="hou">🟠 <b>Houdini:</b> the <b>Prune LOP</b> can deactivate or hide prims, and the eye and active toggles in the Scene Graph Tree pane edit an unsaved scratch layer.</div>` },
      { t: 'mcq', q: 'You want a building to vanish for a whole shot, and you want USD to stop loading its children. Which?', o: ['visibility = invisible', 'active = false', 'Delete the file', 'purpose = guide'], a: 1, why: 'Deactivation removes the subtree from composition entirely.' },
      { t: 'tf', q: 'Visibility can be animated with time samples.', a: true, why: 'It\'s an attribute, so it can be time-sampled. Activation is metadata and can\'t.' },
      { t: 'match', q: 'Match.', pairs: [['active = false', 'Removed from the stage'], ['visibility = invisible', 'Hidden but still there'], ['visibility = inherited', 'Uses the parent\'s visibility']] },
      { t: 'info', h: 'Key takeaways', p: `• You can't delete opinions from weaker layers. You deactivate or hide instead<br>• <b>active</b> = metadata, removes the subtree<br>• <b>visibility</b> = attribute (<code>inherited</code>/<code>invisible</code>), can be animated` },
    ]},
    { id: 'u2d1', kind: 'drill', title: 'Namespace drill', steps: [
      { t: 'mcq', q: 'A prim is most like…', o: ['A pixel', 'A node / folder in a hierarchy', 'A render pass', 'A shader file'], a: 1, why: 'Prims form the namespace tree.' },
      { t: 'tf', q: 'Relationships store numeric values like 3.5.', a: false, why: 'Attributes store values. Relationships store target paths.' },
      { t: 'mcq', q: 'Which is a valid <b>prim</b> path?', o: ['/World/Car.color', 'World/Car', '/World/Car', '/World//Car'], a: 2, why: 'Absolute prim paths start with "/" and contain no property dot.' },
      { t: 'match', q: 'Match the specifier.', pairs: [['def', 'Defines the prim'], ['over', 'Opinions only'], ['class', 'Abstract template']] },
      { t: 'tf', q: 'An over authored on top of a def leaves the prim defined.', a: true, why: 'If any layer defines it, the prim is defined.' },
      { t: 'mcq', q: 'Which keeps a prim around for a camera to aim at, while not rendering it?', o: ['active = false', 'visibility = invisible', 'class specifier', 'Deleting the layer'], a: 1, why: 'Invisible prims still exist and can be inspected or targeted.' },
      { t: 'order', q: 'Order the parts of a prim declaration.', items: ['def', 'Mesh', '"Rock"', '{ … }'], why: 'specifier → type → name → body' },
    ]},
  ]
});

UNITS.push({
  id: 'u3', part: 'p1', title: 'READING .USDA', sub: 'The text syntax, line by line', emoji: '📄', color: '#58cc02', shadow: '#46a302',
  items: [
    { id: 'u3l1', kind: 'lesson', title: 'Anatomy of a file', steps: [
      { t: 'info', h: 'The header', lang: 'usda', code: `#usda 1.0\n(\n    defaultPrim = "World"\n    upAxis = "Y"\n    metersPerUnit = 0.01\n    doc = "A tiny demo"\n)`, p: 'Every text layer starts with the magic line <code>#usda 1.0</code>.', after: `Right after it, an optional block in <b>( parentheses )</b> holds <b>layer metadata</b>: settings for the whole file.<br><br>• <code>defaultPrim</code>: which prim to use when someone references this file without naming one<br>• <code>upAxis</code>: <code>"Y"</code> or <code>"Z"</code><br>• <code>metersPerUnit</code>: 0.01 means 1 unit = 1 cm<br>• <code>doc</code>: a free-text description` },
      { t: 'info', h: 'A prim declaration', lang: 'usda', code: `def Xform "World" (\n    kind = "group"\n)\n{\n    def Sphere "Ball"\n    {\n        double radius = 2\n    }\n}`, p: 'The pattern is always: <b>specifier · type · "name" · (metadata) · { body }</b>.', after: `• <code>def</code>: the specifier<br>• <code>Xform</code>: the <b>type name</b> (its schema)<br>• <code>"World"</code>: the prim name, in quotes<br>• <code>( kind = "group" )</code>: optional <b>prim metadata</b><br>• <code>{ … }</code>: the body, holding properties and child prims` },
      { t: 'tap', q: "Tap the prim's <b>type name</b>.", code: `⟦def⟧ ⟦Sphere⟧ ⟦"Ball"⟧\n{\n    double ⟦radius⟧ = 2\n}`, a: 1, why: 'The type name comes after the specifier. Sphere is a UsdGeom schema.' },
      { t: 'tap', q: 'Tap the <b>prim metadata</b> block.', code: `def Xform "Car" ⟦( kind = "component" )⟧\n⟦{⟧\n    double3 ⟦xformOp:translate⟧ = (1, 0, 0)\n}`, a: 0, why: 'Parentheses after the name hold the prim\'s metadata. The braces hold properties and children.' },
      { t: 'info', h: 'Comments & typeless prims', p: `Lines starting with <code>#</code> (after the header) are comments.<br><br>A prim doesn't need a type: <code>def "Stuff" { }</code> is a valid <b>typeless</b> prim, often used as a plain container or as the target of a reference.` },
      { t: 'mcq', q: 'What does <code>metersPerUnit = 0.01</code> mean?', o: ['1 unit = 1 metre', '1 unit = 1 centimetre', 'Everything is scaled by 0.01 at render', 'Nothing; it\'s a comment'], a: 1, why: 'metersPerUnit declares the scene\'s linear unit. 0.01 m is one centimetre.' },
      { t: 'info', h: 'Key takeaways', p: `• <code>#usda 1.0</code> header, then optional <b>layer metadata</b> in ( )<br>• Prims: <b>specifier Type "name" (metadata) { body }</b><br>• Types are optional, and <code>#</code> starts a comment` },
    ]},
    { id: 'u3l2', kind: 'lesson', title: 'Writing properties', steps: [
      { t: 'info', h: 'Attribute syntax', lang: 'usda', code: `double radius = 2\ncolor3f[] primvars:displayColor = [(1, 0.3, 0.2)]\nuniform token subdivisionScheme = "none"\ncustom string studio:note = "hero prop"\nasset inputs:file = @./textures/rust.png@`, p: 'Read each line as: <b>[modifiers] type name = value</b>.', after: `• <code>[]</code> after a type makes it an <b>array</b><br>• <code>uniform</code>: can't be animated<br>• <code>custom</code>: not part of the prim's schema<br>• <code>@…@</code> wraps an <b>asset path</b> (a file reference)` },
      { t: 'info', h: 'Value syntax', p: `• numbers: <code>2</code>, <code>0.5</code><br>• tuples for vectors and colours: <code>(1, 0, 0)</code><br>• arrays: <code>[1, 2, 3]</code> or <code>[(0,0,0), (1,0,0)]</code><br>• strings and tokens: <code>"text"</code><br>• asset paths: <code>@./file.usd@</code> (use <code>@@@…@@@</code> if the path itself contains an @)<br>• paths: <code>&lt;/World/Ball&gt;</code>` },
      { t: 'tap', q: 'Tap the <b>asset path</b>.', code: `def Shader "Tex" {\n    uniform token info:id = ⟦"UsdUVTexture"⟧\n    asset inputs:file = ⟦@./textures/rust.png@⟧\n    float2 inputs:st.connect = ⟦</Mat/Reader.outputs:result>⟧\n}`, a: 1, why: 'Asset paths are wrapped in @ … @ and resolved by the asset resolver.' },
      { t: 'info', h: 'Relationship syntax', lang: 'usda', code: `rel material:binding = </Mats/Red>\nrel proxyPrim = </World/Tree/proxy>\nrel lights = [</L/Key>, </L/Fill>]`, p: 'Relationships use the <code>rel</code> keyword. Their targets are paths in angle brackets, and they can have several targets.' },
      { t: 'fill', q: 'Point the binding at the Red material.', lang: 'usda', code: `def Mesh "Rock"\n{\n    ▢ material:binding = ▢\n}`, blanks: ['rel', '</Mats/Red>'], extra: ['attr', '"Mats/Red"', '@Red@'], why: 'Relationships use "rel" and path targets in angle brackets.' },
      { t: 'fill', q: 'Complete the file.', lang: 'usda', code: `#usda 1.0\n\ndef ▢ "World"\n{\n    def Cube "Box"\n    {\n        double ▢ = 4\n    }\n}`, blanks: ['Xform', 'size'], extra: ['Prim', 'radius', 'Group'], why: 'Xform is a transformable group. Cube has a "size" attribute (Sphere has "radius").' },
      { t: 'info', h: 'Key takeaways', p: `• Attributes: <b>[uniform/custom] type name = value</b><br>• <code>@…@</code> = asset path, <code>&lt;…&gt;</code> = scene path<br>• Relationships: <code>rel name = &lt;/target&gt;</code>` },
    ]},
    { id: 'u3l3', kind: 'lesson', title: 'Metadata', steps: [
      { t: 'info', h: 'What metadata is', p: `<b>Metadata</b> is the lightest kind of data: a name and a value attached to a <b>layer</b>, a <b>prim</b> or a <b>property</b>.<br><br>Two rules:<br>• It <b>can't be animated</b> (no time samples)<br>• It <b>can't have metadata of its own</b><br><br>You've already seen some: <code>kind</code>, <code>active</code>, <code>defaultPrim</code>, <code>upAxis</code>, <code>instanceable</code>.` },
      { t: 'info', h: 'customData & assetInfo', lang: 'usda', code: `def Xform "Chair" (\n    customData = { string pipeline:dept = "props" }\n    assetInfo = {\n        asset identifier = @./chair.usd@\n        string name = "Chair"\n        string version = "v012"\n    }\n)\n{ }`, p: 'You can\'t invent new metadata names without configuring USD, but there are two built-in "anything goes" dictionaries:', after: `• <b>customData</b>: free-form user data<br>• <b>assetInfo</b>: identifies an asset (<code>identifier</code>, <code>name</code>, <code>version</code>, <code>payloadAssetDependencies</code>). It's advisory: USD itself doesn't use it during composition, but pipelines do.` },
      { t: 'mcq', q: 'Where would you store a free-form note like "approved by supervisor"?', o: ['A new metadata key you invent', 'customData', 'defaultPrim', 'kind'], a: 1, why: 'customData is the free-form dictionary for user data. Inventing new metadata keys needs configuration.' },
      { t: 'tf', q: 'Metadata can be animated with time samples.', a: false, why: 'Metadata is never time-varying. Use an attribute if the value must change over time.' },
      { t: 'info', h: 'Dictionaries merge', p: `When several layers author the same metadata, the strongest opinion wins. <b>Dictionaries</b> such as customData are the exception: they <b>merge key by key</b>, so each layer can add its own entries.` },
      { t: 'info', h: 'Key takeaways', p: `• Metadata = name/value on layers, prims or properties, and can't be animated<br>• Use <b>customData</b> for your own data and <b>assetInfo</b> for asset identity<br>• Dictionary metadata merges key by key across layers` },
    ]},
    { id: 'u3d1', kind: 'drill', title: 'Syntax drill', steps: [
      { t: 'tap', q: 'Tap the <b>layer metadata</b> block opener.', code: `#usda 1.0\n⟦(⟧\n    upAxis = "Y"\n)\n\ndef Xform "World" ⟦{⟧ }`, a: 0, why: 'Parentheses right after the header hold layer metadata.' },
      { t: 'match', q: 'Match the syntax.', pairs: [['@./a.usd@', 'Asset path'], ['</World/Ball>', 'Scene path'], ['[1, 2, 3]', 'Array'], ['(1, 0, 0)', 'Vector / tuple']] },
      { t: 'mcq', q: 'What does <code>uniform</code> before an attribute mean?', o: ['Same value on every prim', 'Cannot be animated', 'Must be a colour', 'Read-only in Python'], a: 1, why: 'uniform = no time samples.' },
      { t: 'fill', q: 'Give the asset a version tag.', lang: 'usda', code: `def Xform "Chair" (\n    ▢ = {\n        string version = "v003"\n    }\n)\n{ }`, blanks: ['assetInfo'], extra: ['kind', 'variants', 'apiSchemas'], why: 'assetInfo holds identifier, name and version.' },
      { t: 'tf', q: 'A prim must always have a type name.', a: false, why: 'Typeless prims like def "Stuff" {} are valid.' },
      { t: 'mcq', q: 'Two layers author different keys in customData. What happens?', o: ['Strongest layer\'s whole dictionary wins', 'They merge key by key', 'Error', 'Weakest wins'], a: 1, why: 'Dictionary-valued metadata merges element-wise.' },
    ]},
  ]
});

UNITS.push({
  id: 'u4', part: 'p1', title: 'SCHEMAS', sub: 'Typed vs API schemas, fallbacks', emoji: '🧱', color: '#58cc02', shadow: '#46a302',
  items: [
    { id: 'u4l1', kind: 'lesson', title: 'Typed (IsA) schemas', steps: [
      { t: 'info', h: 'What a schema is', p: `A <b>schema</b> is a recipe that says "a prim of this kind has these properties, with these defaults, and behaves like this". It gives you a typed C++/Python API, such as <code>sphere.GetRadiusAttr()</code>.<br><br>The prim's <b>type name</b> picks its one <b>typed schema</b> (also called an <b>IsA schema</b>): <code>def Sphere</code> → UsdGeomSphere.` },
      { t: 'info', h: 'Common typed schemas', p: `<b>Xform</b>: a transformable group<br><b>Scope</b>: a group with <b>no transform</b>, for organising (e.g. <code>/Materials</code>)<br><b>Mesh</b>, <b>Sphere</b>, <b>Cube</b>, <b>Cone</b>, <b>Cylinder</b>, <b>Capsule</b>, <b>Plane</b>, <b>Points</b>, <b>BasisCurves</b>: geometry<br><b>Camera</b><br><b>DistantLight</b>, <b>DomeLight</b>, <b>RectLight</b>…: lights<br><b>Material</b>, <b>Shader</b>, <b>NodeGraph</b>: shading<br><b>RenderSettings</b>, <b>RenderProduct</b>, <b>RenderVar</b>: render setup<br><br>Schemas are grouped into <b>domains</b>: <b>UsdGeom</b> (geometry, cameras), <b>UsdLux</b> (lights), <b>UsdShade</b> (materials), <b>UsdSkel</b> (skeletal animation, e.g. <code>SkelRoot</code>), <b>UsdRender</b>, <b>UsdPhysics</b>, <b>UsdVol</b>…` },
      { t: 'mcq', q: 'You need a container for 200 materials. It should never move. Best type?', o: ['Xform', 'Scope', 'Mesh', 'Material'], a: 1, why: 'Scope groups prims without adding a transform.' },
      { t: 'info', h: 'Abstract vs concrete', p: `Schemas form a family tree. Some are <b>abstract</b> base classes you can't create directly (e.g. <b>Imageable</b>: "can be drawn"; <b>Xformable</b>: "can be transformed"; <b>Gprim</b>: "is geometry"). Others are <b>concrete</b>, like Mesh, with a <code>Define()</code> method.<br><br>Asking <code>prim.IsA(UsdGeom.Xformable)</code> is true for Mesh, Xform, Camera…, because they all derive from it.` },
      { t: 'tf', q: 'A prim can have two typed schemas at once, e.g. Mesh and Camera.', a: false, why: 'A prim has exactly one type name, so one typed schema. Extra behaviour comes from API schemas.' },
      { t: 'info', h: 'Fallbacks & the prim definition', p: `Schemas define <b>fallback values</b>: what you get when nothing is authored. A Sphere's radius falls back to 1, visibility to <code>inherited</code>, orientation to <code>rightHanded</code>.<br><br>This keeps files <b>sparse</b>: you only write what differs from the default. The full set of built-in properties and fallbacks is called the prim's <b>prim definition</b>.` },
      { t: 'mcq', q: 'You create <code>def Sphere "S" {}</code> and author nothing. What is its radius?', o: ['0', 'Undefined; Get() errors', 'The schema fallback (1)', '100'], a: 2, why: 'Unauthored built-in attributes return the schema\'s fallback value.' },
      { t: 'info', h: 'Key takeaways', p: `• One <b>typed (IsA)</b> schema per prim, chosen by its type name<br>• Abstract bases (Imageable, Xformable, Gprim) vs concrete types (Mesh, Xform…)<br>• <b>Fallbacks</b> keep scenes sparse` },
    ]},
    { id: 'u4l2', kind: 'lesson', title: 'API schemas', steps: [
      { t: 'info', h: '"Has-a" instead of "is-a"', p: `An <b>API schema</b> adds data and behaviour to a prim <b>without changing its type</b>, like a mix-in or a plug-in component. A Mesh can <i>be</i> a Mesh and <i>have</i> material binding, physics and collision.<br><br>There are three flavours:<br>• <b>Non-applied</b>: just convenience accessors (e.g. <code>UsdModelAPI</code> for kind)<br>• <b>Single-apply</b>: applied once (e.g. <code>MaterialBindingAPI</code>)<br>• <b>Multiple-apply</b>: applied several times under instance names (e.g. <code>CollectionAPI:lightLink</code>)` },
      { t: 'info', h: 'How it looks', lang: 'usda', code: `def Mesh "Rock" (\n    prepend apiSchemas = ["MaterialBindingAPI", "PhysicsRigidBodyAPI", "CollectionAPI:shadow"]\n)\n{\n    rel material:binding = </Mats/Stone>\n}`, p: 'Applied API schemas are recorded in the <code>apiSchemas</code> list metadata.', after: 'Note <code>CollectionAPI:shadow</code>: a multiple-apply schema instance named "shadow".<br><br>In Python, typed schemas are created with <code>Define(stage, path)</code>, and API schemas are added with <code>Apply(prim)</code>, e.g. <code>UsdShade.MaterialBindingAPI.Apply(prim)</code>.' },
      { t: 'mcq', q: 'In Python, how do you add MaterialBindingAPI to an existing prim?', o: ['UsdShade.MaterialBindingAPI.Apply(prim)', 'prim.SetTypeName("MaterialBindingAPI")', 'UsdShade.MaterialBindingAPI.Define(stage, path)', 'prim.AddSchema("binding")'], a: 0, why: 'Applied API schemas use .Apply(prim). Typed schemas use .Define(stage, path).' },
      { t: 'tf', q: '<code>prim.IsA(UsdModelAPI)</code> can return true.', a: false, why: 'IsA only checks typed schemas. Use HasAPI() for API schemas.' },
      { t: 'match', q: 'Match the schema to its family.', pairs: [['Mesh', 'UsdGeom'], ['DomeLight', 'UsdLux'], ['Material', 'UsdShade'], ['SkelRoot', 'UsdSkel']] },
      { t: 'info', h: 'Built-in vs custom properties', p: `Properties that come from a schema are <b>built-in</b>. Anything else you add is <b>custom</b>, marked with the <code>custom</code> keyword in .usda.<br><br>For informal, app-specific data, the convention is the <code>userProperties:</code> namespace, e.g. <code>custom string userProperties:artist</code>.` },
      { t: 'info', h: 'Key takeaways', p: `• API schemas = "has-a" mix-ins, recorded in <code>apiSchemas</code><br>• Non-applied, single-apply and multiple-apply (<code>Name:instance</code>)<br>• Define() typed schemas, Apply() API schemas, check with HasAPI()` },
    ]},
    { id: 'u4d1', kind: 'drill', title: 'Schema drill', steps: [
      { t: 'mcq', q: 'Which changes the prim\'s <b>type name</b>?', o: ['Typed (IsA) schema', 'API schema', 'Both', 'Neither'], a: 0, why: 'One type per prim. API schemas layer on top.' },
      { t: 'tf', q: 'A Scope prim can carry a transform.', a: false, why: 'Scope is deliberately non-transformable.' },
      { t: 'fill', q: 'Apply the collision API.', lang: 'usda', code: `def Mesh "Floor" (\n    prepend ▢ = ["PhysicsCollisionAPI"]\n)\n{}`, blanks: ['apiSchemas'], extra: ['schemas', 'kind', 'references'], why: 'Applied API schemas live in apiSchemas list metadata.' },
      { t: 'match', q: 'Match.', pairs: [['Define()', 'Typed schema → def prim'], ['Apply()', 'Add an API schema'], ['HasAPI()', 'Check an API schema'], ['IsA()', 'Check the typed schema']] },
      { t: 'mcq', q: 'CollectionAPI:lightLink is an example of…', o: ['A typed schema', 'A multiple-apply API schema instance', 'A variant', 'A relationship'], a: 1, why: 'Multiple-apply schemas get an instance name after a colon.' },
      { t: 'tf', q: 'Fallback values are written into your file automatically.', a: false, why: 'Fallbacks come from the schema definition. Files stay sparse.' },
    ]},
  ]
});

// ------------------------------------------------------------ U5
UNITS.push({
  id: 'u5', part: 'p1', title: 'ATTRIBUTES', sub: 'Types, roles, variability, blocks', emoji: '🔢', color: '#58cc02', shadow: '#46a302',
  items: [
    { id: 'u5l1', kind: 'lesson', title: 'Value types', steps: [
      { t: 'info', h: 'Strongly typed', p: `Every attribute has exactly one <b>type</b>, fixed when it's declared:<br><br><code>bool int float double half string</code><br><code>token</code>: an interned string for enum-like values such as <code>"inherited"</code> or <code>"catmullClark"</code><br><code>asset</code>: a file path, written <code>@…@</code><br><code>float2 float3 double3 int3</code>: vectors<br><code>matrix4d quatf quath</code>: transforms and rotations<br>Add <code>[]</code> for arrays: <code>int[] faceVertexCounts</code>` },
      { t: 'info', h: 'token vs string', p: `A <b>token</b> is stored once in a global table and compared super fast, which is ideal for a small fixed set of values that repeat a lot (enums, names).<br><br>A <b>string</b> is for arbitrary text that's unlikely to repeat, like a note or a label.` },
      { t: 'match', q: 'Match the type.', pairs: [['token', 'Enum-like interned string'], ['asset', '@path@ to a file'], ['int[]', 'Array of integers'], ['matrix4d', '4×4 transform']] },
      { t: 'info', h: 'Roles', p: `Some types share the same data but have a <b>role</b> that tells USD how to treat them:<br><br><code>point3f</code>: a position, so it's moved by transforms<br><code>vector3f</code>: a direction, rotated and scaled but not translated<br><code>normal3f</code>: a surface normal, which uses a special inverse-transpose transform<br><code>color3f</code>: a colour, never transformed<br><code>texCoord2f</code>: a UV coordinate<br><br>All five are just floats underneath.` },
      { t: 'mcq', q: 'Which type would you use for a mesh\'s vertex positions?', o: ['float3[]', 'point3f[]', 'vector3f[]', 'color3f[]'], a: 1, why: 'Positions are points, and point3f[] gives them the right role.' },
      { t: 'tf', q: 'A color3f and a point3f are stored differently in memory.', a: false, why: 'Same three floats. The role only changes how they\'re interpreted and transformed.' },
      { t: 'info', h: 'Key takeaways', p: `• One fixed type per attribute. Add <code>[]</code> for arrays<br>• <b>token</b> for enums, <b>string</b> for free text, <b>asset</b> for files<br>• <b>Roles</b> (point, vector, normal, color, texCoord) tell USD how to treat the data` },
    ]},
    { id: 'u5l2', kind: 'lesson', title: 'Variability & blocks', steps: [
      { t: 'info', h: 'varying vs uniform', p: `Attribute <b>variability</b> is either <code>varying</code> (the default, which can be animated) or <code>uniform</code> (meant to stay constant over time).<br><br><code>uniform token subdivisionScheme = "catmullClark"</code><br><br>USD core doesn't actually enforce it. It's a <b>hint</b> that schemas, validators and renderers rely on.` },
      { t: 'tf', q: 'A uniform attribute is meant to be animated with time samples.', a: false, why: 'uniform means time-invariant.' },
      { t: 'info', h: 'Blocking a value', p: `Sometimes you want a stronger layer to say "<b>ignore whatever weaker layers said</b>; this attribute has no value". That's an <b>attribute block</b>:`, lang: 'usda', code: `over "Ball"\n{\n    double radius = None   # blocked!\n}`, after: `The attribute then resolves to its <b>schema fallback</b>, or no value at all. In Python: <code>attr.Block()</code>.<br><br>A newer variant, the <b>animation block</b>, blocks only weaker <i>animation</i> (time samples and splines) and leaves default values visible.` },
      { t: 'mcq', q: 'A weaker layer animates radius. You want the stronger layer to remove ALL of its values. What do you author?', o: ['radius = 0', 'radius = None (a block)', 'active = false', 'delete radius'], a: 1, why: 'Authoring None blocks every weaker opinion.' },

UNITS.push({

    { id: 'u7l1', kind: 'lesson', title: 'Sublayers & strength', steps: [
      { t: 'info', h: 'Composition, in one sentence', p: `<b>Composition</b> is how USD combines many layers into one stage, using <b>composition arcs</b>, the operators that link layers and prims together. There are only a handful: <b>subLayers, inherits, variantSets, relocates, references, payloads, specializes</b>.<br><br>The simplest one is <b>subLayers</b>, so we start there.` },
      { t: 'info', h: 'subLayers', p: `A layer can stack other whole layers <b>underneath itself</b>:`, lang: 'usda', code: `#usda 1.0\n(\n    subLayers = [\n        @./lighting.usda@,\n        @./anim.usda@,\n        @./layout.usda@\n    ]\n)`, after: `All of these layers describe the <b>same paths</b>, so <code>/World/Car</code> in lighting.usda and <code>/World/Car</code> in layout.usda are the same prim. Sublayers are like stacked Photoshop layers covering the same canvas.` },
      { t: 'info', h: 'Who wins?', p: `In the <code>subLayers</code> list, the <b>first</b> layer is the <b>strongest</b>. The layer doing the sublayering (here the root layer) is stronger than all of its sublayers.<br><br>Sublayers can have their own sublayers. The whole flattened, ordered list is called a <b>LayerStack</b>.<br><br><b>root › lighting › anim › layout</b>` },
      { t: 'widget', w: 'layerStack', h: 'Layer stack lab', p: 'Reorder and mute layers. Each property shows which layer won.' },

      { t: 'tf', q: 'Opinions are resolved per property, not per prim.', a: true, why: 'One layer can win radius while another wins colour on the same prim.' },
      { t: 'info', h: 'Key takeaways', p: `• Composition arcs link layers. subLayers is the simplest<br>• First in the list = strongest. The root beats its sublayers<br>• The ordered result is a <b>LayerStack</b>, and opinions resolve per property` },
    ]},
    { id: 'u7l2', kind: 'lesson', title: 'Root & session layers', steps: [
      { t: 'info', h: 'The root layer', p: `The file you open is the stage's <b>root layer</b>. Everything else is pulled in from there.<br><br>On top of the root sits the <b>session layer</b>: an in-memory scratch layer, <b>stronger than everything</b> in the root layer stack. Viewers like usdview store temporary things there: which variant you clicked, what you hid, what you deactivated.` },
      { t: 'info', h: 'Session layer rules', p: `• <code>stage.Save()</code> does <b>not</b> save the session layer<br>• Root layer stack + session layer stack = the <b>root LayerStack</b> of the stage<br>• Use it for "try this without touching any file" edits` },
      { t: 'order', q: 'Strongest → weakest.', items: ['session layer', 'root layer', 'first sublayer', 'last sublayer'], why: 'Session on top, then root, then sublayers in list order.' },
      { t: 'mcq', q: 'Where do temporary, unsaved viewport tweaks usually go?', o: ['Root layer', 'Session layer', 'Weakest sublayer', 'A payload'], a: 1, why: 'The session layer is the strongest and isn\'t saved by stage.Save().' },
      { t: 'info', h: 'Anonymous layers', p: `Layers don't have to exist on disk. <b>Anonymous layers</b> live only in memory and get identifiers like <code>anon:0x7f…</code>. <code>Usd.Stage.CreateInMemory()</code> gives you one as the root.<div class="hou">🟠 <b>Houdini:</b> LOP nodes author into anonymous in-memory layers until you write them out. That's covered in the Solaris chapters.</div>` },
      { t: 'info', h: 'Key takeaways', p: `• You open the <b>root layer</b>. The <b>session layer</b> sits above it, strongest and unsaved<br>• Anonymous layers exist only in memory` },

    { id: 'u7l3', kind: 'lesson', title: 'Edit targets & offsets', steps: [
      { t: 'info', h: 'Where do edits go?', p: `When you call <code>attr.Set(5)</code>, USD writes an opinion into the stage's <b>EditTarget</b>, which is the <b>root layer</b> by default.<br><br>You can retarget edits to any layer in the stack (or even inside a variant, or the target of a reference):`, lang: 'py', code: `fx = Sdf.Layer.FindOrOpen('fx.usda')\nstage.SetEditTarget(fx)\nball.GetAttribute('radius').Set(5)   # written into fx.usda\n\nstage.SetEditTarget(stage.GetSessionLayer())`, after: 'It\'s like choosing which Photoshop layer your brush paints on.' },
      { t: 'mcq', q: 'You call attr.Set(1) on a freshly opened stage. Which layer receives the opinion?', o: ['The strongest sublayer', 'The session layer', 'The root layer', 'A new layer'], a: 2, why: 'By default the edit target is the root layer.' },
      { t: 'info', h: 'Layer offsets', p: `A sublayer (or reference) can <b>shift and scale time</b> for everything it brings in:`, lang: 'usda', code: `subLayers = [\n    @./anim.usda@ (offset = 10; scale = 2)\n]`, after: `Offsets <b>compose</b> along chains: a scale of 2 inside a reference with scale 3.5 gives 7. This is how you reuse a walk cycle starting at a different frame without re-exporting it.` },
      { t: 'mcq', q: 'Shift an animation sublayer so it plays 10 frames later:', o: ['(offset = 10)', '(scale = 10)', '(start = 10)', '(time = +10)'], a: 0, why: 'Layer offsets have offset and scale.' },
      { t: 'info', h: 'Muting & flattening', p: `• <b>Mute</b> a layer to ignore it temporarily: <code>stage.MuteLayer(layer.identifier)</code><br>• <b>Flatten</b> bakes the composed stage into <b>one layer with no arcs left</b>: <code>stage.Flatten()</code>, <code>stage.Export('baked.usda')</code>, or <code>usdcat --flatten</code>. It's great for delivery and debugging, but you lose all the collaboration structure, and text output can get huge.<br>• <b>Localize</b> (used when building .usdz) copies all dependencies and retargets paths <b>without</b> flattening.` },
      { t: 'mcq', q: 'What does flattening remove?', o: ['Prims', 'Time samples', 'Composition arcs / layer structure', 'Materials'], a: 2, why: 'You get one layer with final values. Every arc is resolved away.' },

    { id: 'u7d1', kind: 'drill', title: 'Layer drill', steps: [
      { t: 'order', q: 'subLayers = [@a@, @b@, @c@]. Strongest → weakest (with root).', items: ['root', 'a', 'b', 'c'], why: 'Root beats its sublayers, which go in list order.' },
      { t: 'fill', q: 'Send edits to the fx layer.', lang: 'py', code: `fx = Sdf.Layer.FindOrOpen('fx.usda')\nstage.▢(fx)`, blanks: ['SetEditTarget'], extra: ['SetLayer', 'MuteLayer', 'Flatten'], why: 'stage.SetEditTarget(layer)' },
      { t: 'tf', q: 'stage.Save() writes the session layer to disk.', a: false, why: 'The session layer is never saved by Save().' },
      { t: 'match', q: 'Match.', pairs: [['Mute', 'Ignore a layer temporarily'], ['Flatten', 'Bake to one layer'], ['Edit target', 'Where Set() writes'], ['Session', 'Strongest scratch layer']] },
      { t: 'mcq', q: 'A reference has scale = 2, and inside it a sublayer has scale = 3. Effective scale?', o: ['5', '6', '3', '2'], a: 1, why: 'Offsets compose multiplicatively.' },
      { t: 'tf', q: 'Two sublayers can each win different properties of the same prim.', a: true, why: 'Resolution is per property.' },

});

    { id: 'u9l1', kind: 'lesson', title: 'Variant sets', steps: [
      { t: 'info', h: 'What variants are', p: `A <b>variantSet</b> is a named group of alternatives on a prim. Each <b>variant</b> inside it is a bundle of opinions: overrides, extra child prims, even more composition arcs. A <b>selection</b> picks which one is active.<br><br>Typical uses are looks (clean/dirty), levels of detail (high/low), and geometry options (with/without hat).` },
      { t: 'info', h: 'Syntax', lang: 'usda', code: `def Xform "Car" (\n    variants = { string paint = "red" }\n    prepend variantSets = "paint"\n)\n{\n    variantSet "paint" = {\n        "red"  { color3f[] primvars:displayColor = [(0.9,0.1,0.1)] }\n        "blue" { color3f[] primvars:displayColor = [(0.1,0.3,0.9)] }\n    }\n}`, p: 'Three pieces work together:', after: `• <code>variantSets = "paint"</code>: declares that the set exists (a list op)<br>• <code>variantSet "paint" = { … }</code>: the contents of each variant<br>• <code>variants = { string paint = "red" }</code>: the <b>selection</b>` },
      { t: 'widget', w: 'variantSwitch', h: 'Switch variants', p: 'Pick a selection in each variant set. Then turn on the shot override.' },
      { t: 'info', h: 'The selection is just an opinion', p: `<code>variants = { string paint = "blue" }</code> is an ordinary metadata opinion. That means a <b>stronger layer can override the selection</b> with an <code>over</code>. Shots switch asset looks this way without touching the asset file.<br><br>If <b>no selection</b> is made, the variant set contributes <b>nothing</b>.` },
      { t: 'mcq', q: 'The asset selects paint = "red". The stronger shot layer has <code>over "Car" (variants = {string paint = "blue"})</code>. Result?', o: ['red', 'blue', 'Both', 'Error: conflicting selections'], a: 1, why: 'The stronger selection opinion wins.' },
      { t: 'tf', q: 'A variant set with no selection applies its first variant.', a: false, why: 'No selection means nothing from that set is applied.' },
      { t: 'info', h: 'Key takeaways', p: `• variantSet = named alternatives. variant = a bundle of opinions<br>• <code>variants = {…}</code> is the selection, and it's overridable by stronger layers<br>• No selection = no contribution` },
    ]},
    { id: 'u9l2', kind: 'lesson', title: 'Advanced variants', steps: [
      { t: 'info', h: 'Many sets, nesting & order', p: `• A prim can have <b>many</b> variant sets. Their order in <code>variantSets</code> decides which is stronger if they disagree.<br>• Variants can contain <b>nested</b> variant sets (e.g. a <code>lod</code> set inside each <code>look</code> variant).<br>• Downstream layers can even <b>add new variants</b> to an existing set.` },
      { t: 'info', h: 'Authoring in Python', lang: 'py', code: `vsets = prim.GetVariantSets()\nvset = vsets.AddVariantSet('lod')\nvset.AddVariant('high')\nvset.AddVariant('low')\n\nvset.SetVariantSelection('high')\nwith vset.GetVariantEditContext():\n    # everything authored here goes INSIDE the "high" variant\n    UsdGeom.Mesh.Define(stage, prim.GetPath().AppendChild('Body'))`, p: 'To author <b>inside</b> a variant, select it and open its edit context:', after: 'Forget the edit context and your opinions land outside the variant, applying to every variant.' },
      { t: 'fill', q: 'Author into a variant.', lang: 'py', code: `vset = prim.GetVariantSets().AddVariantSet('lod')\nvset.AddVariant('high')\nvset.▢('high')\nwith vset.▢():\n    ...`, blanks: ['SetVariantSelection', 'GetVariantEditContext'], extra: ['Select', 'EditVariant', 'GetEditTarget'], why: 'Select the variant, then author inside its edit context.' },
      { t: 'info', h: 'Variants vs purpose', p: `Variants are great for <i>choices</i>, but only <b>one variant per set is composed at a time</b>. For "show a light proxy in the viewport but render the full model" you want <b>purpose</b> (proxy/render), because both exist side by side. You'll learn purpose in Part 3.<div class="hou">🟠 <b>Houdini:</b> the <b>Add Variant</b>, <b>Set Variant</b> and <b>Explore Variants</b> LOPs, plus <b>Create LOD</b> and <b>Auto Select LOD</b>, are built on exactly this.</div>` },
      { t: 'tf', q: 'Opinions authored outside the variant edit context apply regardless of the selection.', a: true, why: 'They aren\'t inside any variant.' },
      { t: 'info', h: 'Key takeaways', p: `• Many sets per prim. Nesting and downstream additions are allowed<br>• Use <code>GetVariantEditContext()</code> to author inside a variant<br>• One variant per set at a time, so use purpose for proxy/render pairs` },
    ]},
    { id: 'u9d1', kind: 'drill', title: 'Variant drill', steps: [
      { t: 'match', q: 'Match.', pairs: [['variantSets', 'Declares a set exists'], ['variantSet "x" = {…}', 'Variant contents'], ['variants = {…}', 'The selection']] },
      { t: 'tf', q: 'A variant can contain its own references and child prims.', a: true, why: 'Variants can hold any opinions, including arcs and subtrees.' },
      { t: 'mcq', q: 'Which arc lets a shot switch an asset from "clean" to "dirty"?', o: ['Payload', 'VariantSet selection', 'Specializes', 'Sublayer'], a: 1, why: 'Override the variant selection.' },
      { t: 'mcq', q: 'Show a lightweight stand-in in the viewport and the full model in renders, simultaneously. Best tool?', o: ['A variant set', 'Purpose (proxy + render)', 'Two stages', 'A payload'], a: 1, why: 'Only one variant composes at a time. Purpose keeps both.' },
    ]},
  ]
});
